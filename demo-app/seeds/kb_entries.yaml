entries:
  # ============================================================ 售后政策（after_sales）
  - entry_id: return-policy-7day
    kb_id: after_sales
    category: after_sales
    slug: "after_sales/return-policy-7day.yaml"
    title: "7 天无理由退货"
    content: "我们支持 7 天无理由退货（自签收次日起算，激活后仍可退，运费由我们承担）。退货前请保持商品及附件完整。"
    keywords: ["7 天无理由", "退货", "退", "售后", "签收"]
    version: "1.0.0"
  - entry_id: return-after-activation
    kb_id: after_sales
    category: after_sales
    slug: "after_sales/return-after-activation.yaml"
    title: "激活后退货"
    content: "耳机等数码商品激活后仍可在 7 天无理由退货期内申请退货，不影响退货权益。"
    keywords: ["激活", "退货", "7 天无理由", "退"]
    version: "1.0.0"
  - entry_id: return-shipping-fee
    kb_id: after_sales
    category: after_sales
    slug: "after_sales/return-shipping-fee.yaml"
    title: "退货运费承担"
    content: "7 天无理由退货的运费由我们承担；非质量问题换货运费同样由我们承担。"
    keywords: ["运费", "退货", "谁出", "承担", "邮费"]
    version: "1.0.0"
