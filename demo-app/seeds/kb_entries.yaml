  - entry_id: return-process
    kb_id: after_sales
    category: after_sales
    slug: "after_sales/return-process.yaml"
    title: "退换货流程"
    content: "申请退换货：订单详情页发起申请，审核通过后按指引寄回，仓库签收后 48 小时内处理退款。"
    keywords: ["退换货", "流程", "申请", "退款", "寄回"]
