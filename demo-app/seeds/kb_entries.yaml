    kb_id: after_sales
    category: after_sales
    slug: "after_sales/warranty-policy.yaml"
    title: "保修政策"
    content: "整机保修 12 个月，非人为损坏凭购买记录享受免费保修；人为损坏可付费维修。"
    keywords: ["保修", "质保", "维修", "12 个月", "售后"]
    version: "1.0.0"
