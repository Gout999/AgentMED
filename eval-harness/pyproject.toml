# eval-harness —— AgentMED 评测门禁 / 对照实验执行器 / 变异巡检 / 质量周报
# Python 3.11+；依赖钉版本（见 requirements.txt / requirements-dev.txt）
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmed-eval-harness"
version = "0.1.0"
description = "AgentMED 质量自治底座「考试局」：双轨门禁 + 5-cell 对照实验执行器 + 变异巡检 + 质量周报"
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "PyYAML==6.0.3",
    "jsonschema==4.23.0",
    "openai==1.59.7",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eval_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: 需要 live demo-app + StepFun key 的集成测试（默认连 127.0.0.1:8080，key 缺失自动 skip）",
    "unit: 纯逻辑单测（无网络）",
]
