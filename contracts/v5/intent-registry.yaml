version: "0.2-draft"
status: draft_target_contract
runtime_status: NOT_IMPLEMENTED
public_api_prefix: /api/v2

activation_flags:
  http_routes: false
  cli_commands: false
  sdk_methods: false
  capability_discovery: false
  mcp_tools: false
  a2a_agent_card: false
  a2a_transport: false
  a2a_methods: false

compatibility_surface:
  v4_s1a_registry: contracts/v4/intent-registry.yaml
  public_api_prefix: /api/v1
  behavior: unchanged_compatibility_facade
  canonical_runtime_intents: [capabilities.get, signals.submit, cases.get, cases.timeline, evidence.get]

wire_contract_rules:
  draft_status: DRAFT
  draft_requires_null_field_contract_ref: true
  draft_must_not_generate_any_transport: true
  draft_must_not_enter_capability_discovery: true
  activation_requires_explicit_contract_freeze_and_runtime_evidence: true
  all_transports_share_application_service: true
  frozen_for_implementation_status: FROZEN_FOR_IMPLEMENTATION
  frozen_for_implementation_is_not_activated: true
  frozen_for_implementation_must_not_generate_any_transport: true
  frozen_for_implementation_must_not_enter_capability_discovery: true
  frozen_for_implementation_requires_schema_profile_ref: true
  r3_activation_status: FROZEN_R3
  r4_activation_status: FROZEN_R4
  v5_2b_activation_status: FROZEN_V5_2B

application_component_activation_lifecycle:
  decision_ref: docs/decisions/D-014-v5-application-component-activation-lifecycle.md
  decision: PRESERVE_REGISTERED_TO_ACTIVE
  runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
  public_register_result:
    ai_application: {revision: 1, lifecycle_state: REGISTERED}
    system_component: {revision: 1, lifecycle_state: REGISTERED}
  trusted_manifest_result:
    ai_application: {revision: 2, lifecycle_state: ACTIVE}
    system_component: {revision: 2, lifecycle_state: ACTIVE}
  workflow_only_owner_commands: [applications.activate, system-components.activate]
  activation_authorization:
    invocation: MANIFEST_IMPORT_COORDINATOR_ONLY_SAME_POSTGRESQL_UOW
    direct_public_or_internal_controller_invocation: FORBIDDEN
    exact_authenticated_root_intent: system-manifests.import
    allowed_initiating_principal_types: [human, service]
    exact_binding_fields:
      - authenticated_request_digest
      - manifest_digest
      - idempotency_key
      - workspace_id
      - initiating_principal_id
      - initiating_principal_type
    authority_chain:
      subject_and_authority_receipt_actor: application-catalog-controller
      initiating_command_audit_actor: exact_authenticated_initiating_principal
      both_layers_required_same_transaction: true
    internal_controller_scope_alone_authorizes_activation: false
  standalone_public_activation:
    wire_status: DEFERRED_NOT_FROZEN
    http: FORBIDDEN
    cli: FORBIDDEN
    sdk: FORBIDDEN
    mcp: FORBIDDEN
    a2a: FORBIDDEN
    capability_discovery: FORBIDDEN
  register_intent_may_silently_activate: false

r2_application_catalog_contract:
  stage: R2
  contract_status: FROZEN_FOR_IMPLEMENTATION
  runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
  activated_contract_intents:
    - capabilities.get
    - applications.register
    - applications.get
    - applications.list
    - environments.register
    - environments.get
    - system-components.register
    - system-components.get
    - dependency-edges.record
    - dependency-edges.get
    - system-manifests.import
  transport_runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
  intent_overlays:
    capabilities.get:
      wire_contract_status: FROZEN_R2
      capability_allowlist_exactly_matches_activated_contract_intents: true
    applications.register:
      wire_contract_status: FROZEN_R2
      field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/applications_register
      response_lifecycle: {revision: 1, lifecycle_state: REGISTERED}
      silently_invokes_activation: false
    applications.get:
      wire_contract_status: FROZEN_R2
      field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/applications_get
      returns_exact_current_lifecycle_binding_and_history: true
    applications.list:
      wire_contract_status: FROZEN_R2
      field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/applications_list
      scope: applications:read
      required_project_id: true
      returns_closed_complete_catalog_graph_items: true
      visibility_filter_before_page_and_count: true
      unauthorized_resource_visibility: OPAQUE_OMISSION_WITHOUT_EXISTENCE_DIGEST_OR_COUNT_LEAK
      cursor: SERVER_ISSUED_OPAQUE_WORKSPACE_SCOPE_BOUND
    environments.register:
      wire_contract_status: FROZEN_R2
      field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/environments_register
    environments.get:
      wire_contract_status: FROZEN_R2
      field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/environments_get
    system-components.register:
      wire_contract_status: FROZEN_R2
      field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/system_components_register
    system-components.get:
      wire_contract_status: FROZEN_R2
      field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/system_components_get
    dependency-edges.record:
      wire_contract_status: FROZEN_R2
      field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/dependency_edges_record
    dependency-edges.get:
      wire_contract_status: FROZEN_R2
      field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/dependency_edges_get
    system-manifests.import:
      wire_contract_status: FROZEN_R2_R3_BOOTSTRAP
      field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/bootstrap_system_manifests_import
      bootstrap_only: true
  bootstrap_system_manifest:
    public_intent: true
    contract_status: FROZEN_R2_R3_BOOTSTRAP
    runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    workflow_owner: manifest_import_coordinator
    authenticated_root_intent: system-manifests.import
    response_lifecycle:
      ai_application: {revision: 2, lifecycle_state: ACTIVE}
      each_system_component: {revision: 2, lifecycle_state: ACTIVE}
      exact_initial_system_version_set_binding: REQUIRED
    complete_first_declared_graph_required: true
    scope: WORKSPACE_INITIAL_ONE_SHOT
    precondition: ALL_AUTHORITATIVE_V5_DOMAIN_TABLES_EMPTY
    prior_standalone_registered_catalog_row: BOOTSTRAP_IMPORT_FORBIDDEN
    component_revision_exact_component_binding: CURRENT_AUTHORITATIVE_ACTIVE_REVISION_2
    component_revision_binding_source: LOCKED_APPEND_ONLY_LIFECYCLE_HISTORY
    initial_system_version_set_count: 1
    system_assignment_generation: 1
    standalone_system_versions_record: FORBIDDEN
    second_workspace_bootstrap_or_system_version_set: FORBIDDEN
    semantic_diff_claim: FORBIDDEN
    same_manifest_replay:
      precondition: SAME_IDEMPOTENCY_KEY_AND_SAME_CANONICAL_BODY
      result: IDENTICAL_TERMINAL_ATOMIC_RESPONSE_WITH_ZERO_NEW_FACTS
      different_key_even_same_manifest_digest: CONFLICT_WITH_ZERO_NEW_FACTS
  r3_full_boundary:
    standalone_system_versions_record: NOT_IMPLEMENTED
    second_system_version_set: NOT_IMPLEMENTED
    system_versions_get: NOT_IMPLEMENTED
    system_versions_diff: NOT_IMPLEMENTED
    semantic_diff: NOT_IMPLEMENTED
  standalone_activation:
    public_intent_exists: false
    http: FORBIDDEN
    cli: FORBIDDEN
    sdk: FORBIDDEN
    mcp: FORBIDDEN
    a2a: FORBIDDEN
    capability_discovery: FORBIDDEN
  excluded_intent_stages: [V5-1C, V5-2, V5-3, V5-4, V5-5, V5-6]
  console_read_contract:
    public_intents: [applications.list, applications.get]
    forbidden_internal_dependency: /v1/applications
    credential_source: UI_MEMORY_ONLY
    credential_in_bundle_static_config_log_or_persistence: FORBIDDEN
  cli_utility_boundary:
    system-manifest.validate:
      classification: LOCAL_FILE_VALIDATION_UTILITY
      public_intent: false
      transport: NONE
      capability_discovery: FORBIDDEN
    init_or_repository_discovery:
      owner_stage: R3_FULL
      r2_cli_visibility: HIDDEN
      capability_discovery: FORBIDDEN

d2_complete_version_graph_contract:
  stage: D2
  plan_ref: docs/plans/v5-master-execution-plan.md#17.3
  contract_status: FROZEN_FOR_IMPLEMENTATION
  implementation_status: NOT_IMPLEMENTED
  frozen_intents:
    - system-versions.record
    - system-versions.get
    - system-versions.diff
  activation_status: ACTIVATED_AS_R3_FULL
  transports:
    http: ENABLED
    cli: ENABLED
    sdk: FORBIDDEN
    mcp: FORBIDDEN
    a2a: FORBIDDEN
    capability_discovery: ENABLED
  r3_full_capability_discovery_remains_hidden: false
  record_contract:
    references_existing_authority_valid_objects_only: true
    never_creates_prerequisite_objects: true
    application_required_state: ACTIVE
    environment_required_state: ACTIVE
    component_revision_binding_rule:
      exact_immutable_binding_required: true
      bare_component_id_is_authority: false
      mutable_current_head_is_authority: false
      binding_must_exist_and_be_authority_valid: true
    server_derived_fields: [identity_assurance_summary, version_set_digest]
    creates_immutable_next_system_version_set: true
    lineage_and_cas:
      exact_previous_system_version_set_binding_required_from_second_version: true
      expected_previous: CURRENT_AUTHORITATIVE_HEAD
      stale_or_wrong_previous: REJECT_AND_ROLLBACK_ENTIRE_TRANSACTION
    idempotency:
      key_and_canonical_body_binding: REQUIRED
      same_key_different_body: CONFLICT_WITH_ZERO_NEW_FACTS
    authorization:
      required_trust_roles_any_of: [integrator, trusted_builder]
      authorization_before_idempotency_acquire: true
      wrong_or_missing_trust_role: DENY_AND_AUDIT
    transaction: ALL_OR_NOTHING_LOCAL_POSTGRES
    event_outbox_audit_receipt_and_idempotency_share_uow: true
    event: system_version_set.recorded
  get_contract:
    reauthorizes_every_call: true
    recursive_verification_layers: [record, envelope, digest, event, outbox, audit, authority_receipt]
    missing_or_tampered_any_layer: FAIL_CLOSED
  diff_contract:
    same_workspace_and_application_required: true
    cross_workspace_or_application: REJECT_AND_AUDIT
    self_diff: FORBIDDEN
    output_deterministic: true
    compares_exact_immutable_version_sets_only: true
    reverse_or_reordered_diff_equivocation: FORBIDDEN
  does_not_prove:
    - runtime_path_implemented
    - transport_route_or_capability_activation
    - second_version_set_persisted
    - semantic_diff_runtime

r3_full_contract:
  stage: R3_FULL
  plan_ref: docs/plans/v5-master-execution-plan.md#17.4
  contract_status: FROZEN
  runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
  activated_contract_intents:
    - system-versions.record
    - system-versions.get
    - system-versions.diff
  capability_discovery: ENABLED
  r2_activated_allowlist_unchanged: true

r4_full_contract:
  stage: R4
  plan_ref: docs/plans/v5-master-execution-plan.md#17.5
  contract_status: FROZEN
  runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
  activated_contract_intents:
    - cases.bind-application
    - case-application-bindings.get
    - acceptance-criteria.propose
    - acceptance-criteria.get
    - acceptance-criteria.confirm
  capability_discovery: ENABLED

v5_2b_public_operation_contract:
  stage: V5-2B
  plan_ref: docs/plans/v5-master-execution-plan.md#v5-2b--async-public-intents
  contract_status: FROZEN
  runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
  activated_contract_intents:
    - investigations.start
    - operations.get
    - operations.list
    - operations.cancel-request
  capability_discovery: ENABLED
  projection_creates_business_state_machine: false
  operation_state_derives_only_from: [v4.worker_task, v4.attempt, trusted_domain_artifact]

api_major_selection:
  canonical_intent_identity: [api_major, intent_name]
  default_api_major: 1
  v2_requires_explicit_selection: true
  cli:
    flag: "--api-version 2"
    v2_invocation_prefix: "caseloop --api-version 2"
    silent_default_change: FORBIDDEN
  http:
    request_header: X-CaseLoop-Contract-Version
    response_header: X-CaseLoop-Contract-Version
    v2_required_request_value: "2.0"
    v2_missing_or_other_value_error: REQUEST_INVALID
    v2_missing_or_other_value_is_audited: true
    v2_never_falls_back_to_v1: true
    v1_existing_1_0_header_contract: UNCHANGED
    url_major_must_match_request_header_major: true
    response_must_echo_contract_major: true
    mismatched_or_downgraded_major: REJECT_AND_AUDIT
  capability_response:
    required_fields: [api_major, contract_version, enabled_intents, disabled_intents]
    v1_response_schema_may_be_extended: false

principal_types:
  public: [human, external_agent, service, connector]
  internal: [internal_controller, internal_worker]
  trust_roles_are_server_derived: true
  caller_payload_may_assert_trust_role: false

authorization_defaults:
  deny_unlisted_principal_type: true
  deny_unlisted_scope: true
  all_public_principals_denied_internal_intents: true
  resource_visibility_is_checked_after_workspace_scope: true
  unauthorized_resource_response: OPAQUE_NOT_FOUND

forbidden_public_scopes:
  human:
    - external_operations:execute:internal
    - controllers:record:internal
    - work:claim:internal
  external_agent:
    - approvals:decide:human
    - external_operations:execute:internal
    - controllers:record:internal
    - work:claim:internal
    - observed_state:attest:trusted
    - external_effects:attest:trusted
  service:
    - approvals:decide:human
    - external_operations:execute:internal
    - controllers:record:internal
    - work:claim:internal
  connector:
    - approvals:decide:human
    - external_operations:execute:internal
    - controllers:record:internal
    - work:claim:internal

non_principal_resource_types: [ai_application, system_component, governed_agent]

intents:
  - name: capabilities.get
    contract_major: 2
    delivery_slice: V5-0C
    wire_status: FROZEN_R2
    implementation_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/capabilities_get
    kind: query
    execution_mode: synchronous
    scope: capabilities:read
    allowed_principal_types: [human, external_agent, service, connector]
    idempotency: none
    http: {method: GET, path: /api/v2/capabilities, operation_id: getV5Capabilities}
    cli: capabilities get
    cli_requires_explicit_api_major: true

  - name: applications.register
    contract_major: 2
    delivery_slice: V5-1A
    wire_status: FROZEN_R2
    implementation_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/applications_register
    kind: mutation
    execution_mode: synchronous
    scope: applications:manage
    allowed_principal_types: [human, service]
    required_trust_roles_any_of: [integrator, catalog_admin]
    trust_roles_source: authenticated_server_registration
    idempotency: required
    command_target: {resource: ai_application, command: applications.register}
    http: {method: POST, path: /api/v2/applications, operation_id: registerApplication}
    cli: application register
    cli_requires_explicit_api_major: true

  - name: applications.get
    contract_major: 2
    delivery_slice: V5-1A
    wire_status: FROZEN_R2
    implementation_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/applications_get
    kind: query
    execution_mode: synchronous
    scope: applications:read
    allowed_principal_types: [human, external_agent, service, connector]
    authorization_condition: application_authorized_reader
    idempotency: none
    http: {method: GET, path: "/api/v2/applications/{application_id}", operation_id: getApplication}
    cli: application get
    cli_requires_explicit_api_major: true

  - name: applications.list
    contract_major: 2
    delivery_slice: V5-1A
    wire_status: FROZEN_R2
    implementation_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/applications_list
    kind: query
    execution_mode: synchronous
    scope: applications:read
    allowed_principal_types: [human, external_agent, service, connector]
    authorization_condition: workspace_and_required_project_scoped_application_authorized_reader
    idempotency: none
    pagination: {cursor: server_issued_opaque, visibility_filter_before_page_and_count: true}
    http:
      method: GET
      path: /api/v2/applications
      query_parameters: {required: [project_id], optional: [cursor, limit]}
      operation_id: listApplications
    cli: application list
    cli_requires_explicit_api_major: true

  - name: environments.register
    contract_major: 2
    delivery_slice: V5-1A
    wire_status: FROZEN_R2
    implementation_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/environments_register
    kind: mutation
    execution_mode: synchronous
    scope: applications:manage
    allowed_principal_types: [human, service]
    required_trust_roles_any_of: [integrator, catalog_admin]
    trust_roles_source: authenticated_server_registration
    idempotency: required
    command_target: {resource: environment, command: environments.register}
    http: {method: POST, path: /api/v2/environments, operation_id: registerEnvironment}
    cli: environment register
    cli_requires_explicit_api_major: true

  - name: environments.get
    contract_major: 2
    delivery_slice: V5-1A
    wire_status: FROZEN_R2
    implementation_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/environments_get
    kind: query
    execution_mode: synchronous
    scope: applications:read
    allowed_principal_types: [human, external_agent, service, connector]
    authorization_condition: application_environment_authorized_reader
    idempotency: none
    http: {method: GET, path: "/api/v2/environments/{environment_id}", operation_id: getEnvironment}
    cli: environment get
    cli_requires_explicit_api_major: true

  - name: system-components.register
    contract_major: 2
    delivery_slice: V5-1A
    wire_status: FROZEN_R2
    implementation_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/system_components_register
    kind: mutation
    execution_mode: synchronous
    scope: applications:manage
    allowed_principal_types: [human, service]
    required_trust_roles_any_of: [integrator, catalog_admin]
    trust_roles_source: authenticated_server_registration
    idempotency: required
    command_target: {resource: system_component, command: system-components.register}
    http: {method: POST, path: /api/v2/system-components, operation_id: registerSystemComponent}
    cli: system-component register
    cli_requires_explicit_api_major: true

  - name: system-components.get
    contract_major: 2
    delivery_slice: V5-1A
    wire_status: FROZEN_R2
    implementation_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/system_components_get
    kind: query
    execution_mode: synchronous
    scope: applications:read
    allowed_principal_types: [human, external_agent, service, connector]
    authorization_condition: application_component_authorized_reader
    idempotency: none
    http: {method: GET, path: "/api/v2/system-components/{component_id}", operation_id: getSystemComponent}
    cli: system-component get
    cli_requires_explicit_api_major: true

  - name: dependency-edges.record
    contract_major: 2
    delivery_slice: V5-1A
    wire_status: FROZEN_R2
    implementation_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/dependency_edges_record
    kind: mutation
    execution_mode: synchronous
    scope: applications:manage
    allowed_principal_types: [human, service]
    required_trust_roles_any_of: [integrator, catalog_admin]
    trust_roles_source: authenticated_server_registration
    idempotency: required
    command_target: {resource: dependency_edge, command: dependency-edges.record}
    http: {method: POST, path: /api/v2/dependency-edges, operation_id: recordDependencyEdge}
    cli: dependency-edge record
    cli_requires_explicit_api_major: true

  - name: dependency-edges.get
    contract_major: 2
    delivery_slice: V5-1A
    wire_status: FROZEN_R2
    implementation_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/dependency_edges_get
    kind: query
    execution_mode: synchronous
    scope: applications:read
    allowed_principal_types: [human, external_agent, service, connector]
    authorization_condition: application_dependency_edge_authorized_reader
    idempotency: none
    http: {method: GET, path: "/api/v2/dependency-edges/{dependency_edge_id}", operation_id: getDependencyEdge}
    cli: dependency-edge get
    cli_requires_explicit_api_major: true

  - name: system-manifests.import
    contract_major: 2
    delivery_slice: V5-1B
    r2_delivery_mode: R3_BOOTSTRAP_COUPLED_TO_R2
    wire_status: FROZEN_R2_R3_BOOTSTRAP
    implementation_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    field_contract_ref: contracts/v5/schema-profiles.yaml#r2_wire_profiles/bootstrap_system_manifests_import
    kind: mutation
    execution_mode: synchronous_local_transaction
    scope: system_manifests:import
    allowed_principal_types: [human, service]
    required_trust_roles_any_of: [integrator, catalog_admin, trusted_builder]
    trust_roles_source: authenticated_server_registration
    idempotency: required
    workflow_owner: manifest_import_coordinator
    workflow_activation_authorization:
      exact_authenticated_request_required: true
      exact_manifest_digest_required: true
      exact_initiating_principal_required: true
      same_postgresql_unit_of_work_required: true
      direct_activation_command_invocation: FORBIDDEN
    bootstrap_only_contract:
      creates_complete_first_declared_graph: true
      scope: WORKSPACE_INITIAL_ONE_SHOT
      precondition: ALL_AUTHORITATIVE_V5_DOMAIN_TABLES_EMPTY
      prior_standalone_registered_catalog_row: BOOTSTRAP_IMPORT_FORBIDDEN
      component_revision_exact_component_binding: CURRENT_AUTHORITATIVE_ACTIVE_REVISION_2
      component_revision_binding_source: LOCKED_APPEND_ONLY_LIFECYCLE_HISTORY
      initial_system_version_set_count: 1
      second_workspace_bootstrap_or_system_version_set: FORBIDDEN
      standalone_system_versions_record: FORBIDDEN
      semantic_diff_claim: FORBIDDEN
      observed_or_effect_claim: FORBIDDEN
      same_manifest_retry_precondition: SAME_IDEMPOTENCY_KEY_AND_SAME_CANONICAL_BODY
      same_manifest_replay_response: IDENTICAL_TERMINAL_ATOMIC_RESPONSE_WITH_ZERO_NEW_FACTS
      different_key_even_same_manifest_digest: CONFLICT_WITH_ZERO_NEW_FACTS
    workflow_targets:
      - {resource: ai_application, command: applications.register}
      - {resource: ai_application, command: applications.activate}
      - {resource: environment, command: environments.register}
