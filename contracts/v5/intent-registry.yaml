operation_projection_contract:
  owner: projection-builder
  creates_business_state_machine: false
  derives_from: [v4.worker_task, v4.attempt, trusted_domain_artifact]
  states: [SUBMITTED, WORKING, INPUT_REQUIRED, AUTH_REQUIRED, CANCEL_REQUESTED, CANCELED, REJECTED, FAILED, COMPLETED]
  domain_result_fields: [artifact_kind, schema_major, domain_verdict, evidence_completeness, exact_artifact_binding]
  semantics:
    completed: trusted_domain_artifact_was_produced
    failed: no_trustworthy_domain_artifact_was_produced
    cancel_requested: stop_requested_but_not_confirmed
    canceled: cancellation_confirmed_by_work_owner
    domain_non_pass_can_be_completed: true

agent_protocol_target:
  activation: AFTER_V5_2_DURABLE_WORK_AND_SEPARATE_ACCEPTANCE
  activation_authority: activation_flags
  domain_task_state_is_transport_state: false
  a2a:
    draft_status: DRAFT_NOT_ACTIVE
    protocolVersion: "1.0"
    activation_flag_refs: [a2a_agent_card, a2a_transport, a2a_methods]
    activation_requires_all_referenced_flags_true: true
    required_request_version_header: A2A-Version
    methods: [SendMessage, GetTask, ListTasks, CancelTask]
    send_message_creates_server_task: true
    method_mapping:
      SendMessage:
        canonical_async_intents: [investigations.start, evaluations.start]
        intent_discriminator_field: caseloop_intent
        discriminator_location: structured_message_data_part
        missing_or_ambiguous_discriminator: REJECT
      GetTask: operations.get
      ListTasks: operations.list
      CancelTask: operations.cancel-request
    visibility_inherits_canonical_operation_authorization: true
    task_binding_required_fields: [authenticated_principal_id, operation_id, context_id, task_id, message_id, canonical_intent, canonical_idempotency_key]
    task_id_issued_by_server: true
    task_id_globally_unique: true
    idempotency_derivation: sha256(authenticated_principal_id,context_id,message_id,canonical_intent,canonical_request_digest)
    duplicate_message_same_digest_returns_same_task: true
    duplicate_message_different_digest: CONFLICT
    continuation_requires_existing_visible_context_and_task: true
