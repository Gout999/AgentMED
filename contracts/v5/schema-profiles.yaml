  component_revision_writer_validation_runtime: NOT_IMPLEMENTED
  component_revision_producer_atomic_enforcement_runtime: NOT_IMPLEMENTED
  component_revision_producer_owner_stage: R3
  implemented_lifecycle_primitives:
