  stage: R1
  contract_status: CANDIDATE
  r1_foundation_runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
  revision_2_storage_cas_harness: NON_PRODUCTION_IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
  composed_manifest_activation_runtime: NOT_IMPLEMENTED
  composed_manifest_activation_owner_stage: R2
  production_activated_event_routes: DISABLED
