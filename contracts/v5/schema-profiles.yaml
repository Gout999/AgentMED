    application_must_be_exact_current_authoritative_lifecycle_revision: true
    authorization_before_visibility: true
    additional_properties: false
  applications_list:
    request_required_fields: [project_id]
    request_optional_fields: [cursor, limit]
    workspace_source: AUTHENTICATED_HEADER_CONTEXT
    response_required_fields: [schema_version, workspace_id, request_id, audit_ref, items, next_cursor]
    response_constants: {schema_version: "2.0"}
    item_required_fields: [application, environments, system_components, dependency_edges]
    item_field_refs:
      application: contracts/v5/schema-profiles.yaml#r2_wire_record_shapes/ApplicationRecord
      environments: list[contracts/v5/schema-profiles.yaml#r2_wire_record_shapes/EnvironmentRecord]
      system_components: list[contracts/v5/schema-profiles.yaml#r2_wire_record_shapes/SystemComponentRecord]
      dependency_edges: list[contracts/v5/schema-profiles.yaml#r2_wire_record_shapes/DependencyEdgeRecord]
    request_additional_properties: false
    response_additional_properties: false
    item_additional_properties: false
    required_scope: applications:read
    workspace_and_object_authorization_before_visibility: true
    visibility_filter_before_page_and_count: true
    cursor_profile: SERVER_ISSUED_OPAQUE_WORKSPACE_SCOPE_BOUND
    forged_expired_or_cross_scope_cursor: REQUEST_INVALID_ZERO_ITEMS
    unauthorized_collection_member_visibility: OMIT_WITHOUT_EXISTENCE_DIGEST_OR_COUNT_LEAK
    unauthorized_items_are_omitted_without_count_leak: true
    graph_invariants:
      - application_record_is_exact_current_authoritative_lifecycle_revision
      - application_project_id_equals_required_request_project_id
      - application_and_every_nested_record_share_authenticated_workspace
      - every_nested_record_application_id_equals_application.application_id
      - every_nested_record_envelope_is_immutable_and_authority_receipt_bound
      - each_system_component_record_is_exact_current_authoritative_lifecycle_revision
      - dependency_edge_endpoints_are_members_of_system_components
