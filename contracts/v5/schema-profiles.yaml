  internal_manifest_response_state: {revision: 2, lifecycle_state: ACTIVE}
  standalone_activation_route_status: FORBIDDEN
  r3_r4_profiles_runtime_status: NOT_IMPLEMENTED

r2_wire_profiles:
  capabilities_get:
    response_required_fields: [schema_version, workspace_id, request_id, audit_ref, data]
    response_constants: {schema_version: "2.0"}
    data_required_fields: [server_version, api_major, contract_version, principal, enabled_intents, disabled_intents, generated_at]
    data_constants: {api_major: 2, contract_version: "2.0", disabled_intents: []}
    enabled_intent_required_fields: [name, scope, execution_mode, http, cli]
    contract_allowlist_exact_count: 14
    contract_allowlist_exact_names: [capabilities.get, applications.register, applications.get, applications.list, environments.register, environments.get, system-components.register, system-components.get, dependency-edges.record, dependency-edges.get, system-manifests.import, system-versions.record, system-versions.get, system-versions.diff]
    scope_filtered: true
    response_intents: INTERSECTION_OF_CONTRACT_ALLOWLIST_AND_AUTHENTICATED_SCOPE_AUTHORIZED_INTENTS
    unauthorized_intent_names_omitted: true
    additional_properties: false
  applications_register:
    request_required_fields:
      - schema_version
      - project_id
      - slug
      - display_name
      - owner_principal_ids
      - criticality
      - data_classification
      - governance_mode
    response_required_fields: [schema_version, workspace_id, request_id, audit_ref, application, idempotency]
    response_field_refs:
      application: contracts/v5/schema-profiles.yaml#r2_wire_record_shapes/ApplicationRecord
      idempotency: control-plane/app/public_api/v5_models.py#V5IdempotencyDelivery
