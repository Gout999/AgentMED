      idempotency: control-plane/app/public_api/v5_models.py#V5IdempotencyDelivery
    additional_properties: false
  environments_get:
    response_required_fields: [schema_version, workspace_id, request_id, audit_ref, environment]
    response_field_refs:
      environment: contracts/v5/schema-profiles.yaml#r2_wire_record_shapes/EnvironmentRecord
    authorization_before_visibility: true
    additional_properties: false
  system_components_register:
    request_required_fields: [schema_version, application_id, component_kind, logical_name, owner_principal_ids, criticality, data_classification, permission_classification, effect_classification]
    request_optional_fields: [dataset_role]
    response_required_fields: [schema_version, workspace_id, request_id, audit_ref, component, idempotency]
    response_field_refs:
      component: contracts/v5/schema-profiles.yaml#r2_wire_record_shapes/SystemComponentRecord
      idempotency: control-plane/app/public_api/v5_models.py#V5IdempotencyDelivery
    component_lifecycle_constraint: {record_envelope.revision: 1, lifecycle_state: REGISTERED}
    additional_properties: false
  system_components_get:
    response_required_fields: [schema_version, workspace_id, request_id, audit_ref, component]
    response_field_refs:
      component: contracts/v5/schema-profiles.yaml#r2_wire_record_shapes/SystemComponentRecord
    component_must_be_exact_current_authoritative_lifecycle_revision: true
    authorization_before_visibility: true
    additional_properties: false
  dependency_edges_record:
    request_required_fields: [schema_version, application_id, from_component_id, to_component_id, relation, required]
    response_required_fields: [schema_version, workspace_id, request_id, audit_ref, edge, idempotency]
    response_field_refs:
      edge: contracts/v5/schema-profiles.yaml#r2_wire_record_shapes/DependencyEdgeRecord
      idempotency: control-plane/app/public_api/v5_models.py#V5IdempotencyDelivery
    additional_properties: false
  dependency_edges_get:
    response_required_fields: [schema_version, workspace_id, request_id, audit_ref, edge]
    response_field_refs:
      edge: contracts/v5/schema-profiles.yaml#r2_wire_record_shapes/DependencyEdgeRecord
    authorization_before_visibility: true
    additional_properties: false
  bootstrap_system_manifests_import:
    request_required_fields: [schema_version, application, environment, components]
    request_optional_fields: [dependency_edges, approver_policy]
    request_field_refs:
      application: control-plane/app/public_api/v5_models.py#ManifestApplication
      environment: control-plane/app/public_api/v5_models.py#ManifestEnvironment
      components: list[control-plane/app/public_api/v5_models.py#ManifestComponent]
      dependency_edges: list[control-plane/app/public_api/v5_models.py#ManifestEdge]
      approver_policy: control-plane/app/public_api/v5_models.py#ManifestComponent|null
    client_manifest_digest_field: FORBIDDEN_SERVER_COMPUTED
    response_required_fields:
      - schema_version
      - workspace_id
      - request_id
      - audit_ref
      - manifest_id
      - manifest_digest
      - application
      - environment
      - components
      - dependency_edges
      - component_revisions
      - topology_revision
      - system_version_set
      - bootstrap_attestation
      - system_assignment
      - idempotency
    response_optional_fields: [approver_policy_revision]
    response_field_refs:
      application: contracts/v5/schema-profiles.yaml#r2_wire_record_shapes/ApplicationRecord
      environment: contracts/v5/schema-profiles.yaml#r2_wire_record_shapes/EnvironmentRecord
      components: list[contracts/v5/schema-profiles.yaml#r2_wire_record_shapes/SystemComponentRecord]
      dependency_edges: list[contracts/v5/schema-profiles.yaml#r2_wire_record_shapes/DependencyEdgeRecord]
      component_revisions: list[control-plane/app/public_api/v5_models.py#ComponentRevisionRecord]
      topology_revision: control-plane/app/public_api/v5_models.py#TopologyRevisionRecord
      system_version_set: control-plane/app/public_api/v5_models.py#SystemVersionSetRecord
      bootstrap_attestation: control-plane/app/public_api/v5_models.py#BootstrapAttestationRecord
      system_assignment: control-plane/app/public_api/v5_models.py#SystemAssignmentRecord
      approver_policy_revision: control-plane/app/public_api/v5_models.py#ComponentRevisionRecord|null
      idempotency: control-plane/app/public_api/v5_models.py#V5IdempotencyDelivery
    initial_system_version_set_count: 1
    scope: WORKSPACE_INITIAL_ONE_SHOT
    precondition: ALL_AUTHORITATIVE_V5_DOMAIN_TABLES_EMPTY
    prior_standalone_registered_catalog_row: BOOTSTRAP_IMPORT_FORBIDDEN
    component_revision_binding_rule:
      exact_system_component_binding: CURRENT_AUTHORITATIVE_ACTIVE_REVISION_2
      resolution_source: LOCKED_APPEND_ONLY_LIFECYCLE_HISTORY
      stale_registered_or_client_supplied_binding: FORBIDDEN
    same_manifest_replay:
      precondition: SAME_IDEMPOTENCY_KEY_AND_SAME_CANONICAL_BODY
      response: IDENTICAL_TERMINAL_ATOMIC_RESPONSE
      new_revisions_events_outbox_audits_receipts_and_facts: ZERO
      different_key_even_same_manifest_digest: CONFLICT_WITH_ZERO_NEW_FACTS
    second_workspace_bootstrap_or_system_version_set: FORBIDDEN
    semantic_diff_claim: FORBIDDEN
    additional_properties: false
  bootstrap_system_manifest_result:
    required_fields:
      - exact_application_binding
      - exact_component_bindings
      - exact_initial_system_version_set_binding
      - lifecycle_state
      - replayed
    constants: {lifecycle_state: ACTIVE}
    application_binding_constraint: exact_record_binding_v5:AI_APPLICATION@revision_2
    component_binding_constraint: list[exact_record_binding_v5:SYSTEM_COMPONENT@revision_2]
    initial_system_version_set_binding_constraint: exact_record_binding_v5:SYSTEM_VERSION_SET@revision_1
    additional_properties: false

d2_wire_profiles:
  system_versions_record:
    request_required_fields:
      - schema_version
      - application_id
      - environment_id
      - exact_component_revision_bindings
      - exact_topology_revision_binding
      - exact_previous_system_version_set_binding_or_null
    response_required_fields: [schema_version, workspace_id, request_id, audit_ref, system_version_set, idempotency]
    response_field_refs:
      system_version_set: contracts/v5/schemas/system-versions.record.schema.json#/$defs/recordedSystemVersionSet
      idempotency: control-plane/app/public_api/v5_models.py#V5IdempotencyDelivery
    references_existing_authority_valid_objects_only: true
    never_creates_prerequisite_objects: true
    application_required_state: ACTIVE
    server_derived_fields: [identity_assurance_summary, version_set_digest]
    lineage_and_cas:
      exact_previous_system_version_set_binding_required_from_second_version: true
      expected_previous: CURRENT_AUTHORITATIVE_HEAD
      stale_or_wrong_previous: REJECT_AND_ROLLBACK_ENTIRE_TRANSACTION
    idempotency:
      key_and_canonical_body_binding: REQUIRED
      same_key_same_body_replay: IDENTICAL_TERMINAL_ATOMIC_RESPONSE_ZERO_NEW_FACTS
      same_key_different_body: CONFLICT_WITH_ZERO_NEW_FACTS
    authorization:
      required_trust_roles_any_of: [integrator, trusted_builder]
      authorization_before_idempotency_acquire: true
    additional_properties: false
  system_versions_get:
    response_required_fields: [schema_version, workspace_id, request_id, audit_ref, system_version_set]
    response_field_refs:
      system_version_set: contracts/v5/schemas/system-versions.get.schema.json#/$defs/recordedSystemVersionSet
    reauthorizes_every_call: true
    recursive_verification_layers: [record, envelope, digest, event, outbox, audit, authority_receipt]
    missing_or_tampered_any_layer: FAIL_CLOSED
    additional_properties: false
  system_versions_diff:
    request_required_fields: [source_version_set_id, target_version_set_id]
    request_source: QUERY_PARAMETERS
    response_required_fields: [schema_version, workspace_id, request_id, audit_ref, source_binding, target_binding, diff]
    response_field_refs:
      source_binding: contracts/v5/schemas/system-manifests.import.schema.json#/$defs/exactSystemVersionSetBinding
      target_binding: contracts/v5/schemas/system-manifests.import.schema.json#/$defs/exactSystemVersionSetBinding
      diff: contracts/v5/schemas/system-versions.diff.schema.json#/$defs/versionDiff
    same_workspace_and_application_required: true
    cross_workspace_or_application: REJECT_AND_AUDIT
    self_diff: FORBIDDEN
    output_deterministic: true
    compares_exact_immutable_version_sets_only: true
    additional_properties: false

r2_wire_record_shapes:
  ApplicationRecord:
    authority_profile_ref: contracts/v5/schema-profiles.yaml#profiles/ai_application
    required_base_fields: [record_envelope, application_id, workspace_id, project_id, slug, display_name, owner_principal_ids, criticality, data_classification, governance_mode, lifecycle_state]
    revision_shape_ref: contracts/v5/schema-profiles.yaml#profiles/ai_application/revision_shape_union
    exact_current_binding_rule: kind=AI_APPLICATION,id=application_id,revision=record_envelope.revision,digest=record_envelope.record_digest
    additional_properties: false
  EnvironmentRecord:
    required_fields: [record_envelope, environment_id, workspace_id, application_id, logical_name, risk_classification, lifecycle_state]
    record_envelope_ref: contracts/v5/domain-model.yaml#record_envelope
    lifecycle_states: [ACTIVE, RETIRED]
    exact_current_binding_rule: kind=ENVIRONMENT,id=environment_id,revision=record_envelope.revision,digest=record_envelope.record_digest
    additional_properties: false
  SystemComponentRecord:
    authority_profile_ref: contracts/v5/schema-profiles.yaml#profiles/system_component
    required_base_fields: [record_envelope, component_id, workspace_id, application_id, component_kind, logical_name, owner_principal_ids, criticality, data_classification, permission_classification, effect_classification, dataset_role, lifecycle_state]
    revision_shape_ref: contracts/v5/schema-profiles.yaml#profiles/system_component/revision_shape_union
    exact_current_binding_rule: kind=SYSTEM_COMPONENT,id=component_id,revision=record_envelope.revision,digest=record_envelope.record_digest
    additional_properties: false
  DependencyEdgeRecord:
    required_fields: [record_envelope, edge_id, workspace_id, application_id, from_component_id, to_component_id, relation, required, edge_digest]
    record_envelope_ref: contracts/v5/domain-model.yaml#record_envelope
    exact_current_binding_rule: kind=DEPENDENCY_EDGE,id=edge_id,revision=record_envelope.revision,digest=record_envelope.record_digest
    edge_digest_must_match_canonical_record: true
    additional_properties: false

purpose:
  - define_v5_exact_record_binding_space
  - define_schema_major_2_successors_for_closed_v4_records
  - preserve_v4_logical_owners_and_state_machines_without_json_schema_inheritance

strictness:
  additional_properties: false
  canonicalization: jcs-rfc8785-v1
  digest: sha256
  unknown_fields: REJECT
  closed_v4_schema_extension: FORBIDDEN
  cross_major_binding_without_explicit_profile: FORBIDDEN

common:
  record_envelope_ref: contracts/v5/domain-model.yaml#record_envelope
  canonical_record_digest:
    scope: full_canonical_record_including_envelope_and_payload
    excluded_json_pointer: /record_envelope/record_digest
    algorithm: jcs-rfc8785-v1+sha256
    exact_binding_digest_must_equal_target_record_digest: true
    business_specific_digests_are_subartifact_checksums_not_authority: true
  exact_record_binding_v4_bridge:
    purpose: exact_reference_to_preserved_contract_major_1_record
    required_fields: [contract_major, kind, id, revision, digest]
    additional_properties: false
    constants:
      contract_major: 1
    revision: integer_min_1_or_null_for_v4_singleton_immutable_records
    kinds:
      - QUALITY_CASE
      - CANDIDATE_CONTRACT
      - PROPOSAL
      - PROPOSAL_DECISION
      - ATTEMPT
      - GATE_TRACK_RECEIPT
      - CONTROLLER_REGISTRATION
      - TRACE_EVIDENCE_RECEIPT
      - MODEL_CALL_RECEIPT
      - RESOLUTION_REVIEW_RECEIPT
    digest_rule: digest_equals_preserved_v4_canonical_authority_digest
  exact_record_binding_v5:
    required_fields: [kind, id, revision, digest]
    additional_properties: false
    revision: integer_min_1
    kinds:
      - AI_APPLICATION
      - ENVIRONMENT
      - SYSTEM_COMPONENT
      - DEPENDENCY_EDGE
      - COMPONENT_REVISION
      - PROVIDER_VERSION_ATTESTATION
      - TOPOLOGY_REVISION
      - SYSTEM_VERSION_SET
      - BOOTSTRAP_ATTESTATION
      - SYSTEM_ASSIGNMENT
      - APPLICATION_CASE_BINDING
      - CASE_EPISODE_BINDING
      - ACCEPTANCE_CRITERIA_REVISION
      - BADCASE_SPEC
      - REGRESSION_ASSET
      - OBSERVED_STATE_SNAPSHOT
      - OPERATION_EXECUTION_RECEIPT
      - EXTERNAL_EFFECT_RECEIPT
      - SYSTEM_EPISODE_SNAPSHOT
      - EVALUATION_BUNDLE
      - RELEASE_PLAN
      - SYSTEM_CANDIDATE_REVISION
      - SYSTEM_EVALUATION_PLAN
      - SYSTEM_GATE_EXECUTION
      - SYSTEM_GATE_TRACK_RECEIPT
      - SYSTEM_GATE_REPORT
      - SYSTEM_WORKORDER
      - SYSTEM_RECOVERY_WORKORDER
      - SYSTEM_APPROVAL_GRANT
      - SYSTEM_CAPABILITY_LEASE
      - SYSTEM_EXTERNAL_OPERATION
    digest_rule: digest_equals_target_record_envelope_record_digest
  exact_evidence_binding_union:
    one_of:
      - exact_record_binding_v4_bridge:
          allowed_kinds: [TRACE_EVIDENCE_RECEIPT, MODEL_CALL_RECEIPT, RESOLUTION_REVIEW_RECEIPT]
      - exact_record_binding_v5:
          allowed_kinds: [SYSTEM_EPISODE_SNAPSHOT, OBSERVED_STATE_SNAPSHOT, OPERATION_EXECUTION_RECEIPT, EXTERNAL_EFFECT_RECEIPT]
    mutable_projection_binding: FORBIDDEN
  exact_evaluation_subject_binding_union:
    one_of:
      - exact_record_binding_v5:SYSTEM_CANDIDATE_REVISION
      - exact_record_binding_v5:SYSTEM_RECOVERY_WORKORDER
  release_authority_key:
    algorithm: sha256
    inputs: [workspace_id, exact_workorder_or_recovery_workorder_binding, nonce, exact_target_system_version_set_binding, expected_assignment_generation, operation_kind]
    caller_supplied: false
    derived_and_verified_by_each_controller: true
    one_key_may_authorize_at_most_one_approval_one_capability_and_one_external_operation: true
  authority_receipt_v5:
    logical_owner: control-plane-authority
    schema_major: 2
    required_fields:
      - schema_version
      - authority_receipt_id
      - workspace_id
      - controller_registration
      - subject
      - owner
      - controller_principal
      - command
      - source_event_id
      - transaction_id
      - audit_ref
      - recorded_at
      - immutable
      - hash_rule
      - authority_receipt_digest
    field_refs:
      controller_registration: exact_record_binding_v4_bridge:CONTROLLER_REGISTRATION
      subject: exact_record_binding_v5
    constants:
      immutable: true
      hash_rule: jcs-rfc8785-v1+sha256(excluding:/authority_receipt_digest)
    digest_scope: full_canonical_authority_receipt
    digest_rule: authority_receipt_digest_equals_sha256_of_canonical_receipt_excluding_digest_field
    invariants:
      - subject_kind_is_in_v5_binding_enum
      - subject_and_receipt_share_transaction
      - receipt_is_recording_proof_not_execution_authority
      - receipt_digest_is_not_stored_in_subject
      - receipt_is_not_itself_a_subject_in_the_v5_exact_binding_space
      - controller_registration_was_active_unexpired_and_workspace_matched_at_recorded_at
      - controller_owner_principal_allowed_command_and_subject_canonical_owner_all_match
      - subject_equals_event_envelope_exact_subject_binding
      - source_event_id_equals_event_envelope_event_id
      - transaction_id_equals_event_envelope_transaction_id
      - authority_receipt_id_equals_subject_envelope_and_event_envelope_authority_receipt_id
    additional_properties: false
  lifecycle_revision_authority_v5:
    exact_binding_profile: exact_record_binding_v5
    authoritative_storage: APPEND_ONLY_IMMUTABLE_HISTORY
    exact_resolution_key: [kind, id, revision, digest]
    initial_revision:
      revision: 1
      exact_previous_binding: null
      lifecycle_state: REGISTERED
    transition_revision:
      exact_previous_binding_is_server_derived_from_locked_history: true
      same_kind_id_and_workspace_as_previous: true
      revision_equals_previous_revision_plus_one: true
      compare_and_swap_required: true
      current_head_is_projection_not_history_authority: true
    digest_rule: each_revision_has_independent_canonical_record_digest
    overwrite_or_relabel_historical_revision: FORBIDDEN
  manifest_activation_context_v5:
    required_fields:
      - root_intent
      - workflow_owner
      - authenticated_request_digest
      - manifest_digest
      - idempotency_key
      - workspace_id
      - initiating_principal_id
      - initiating_principal_type
      - initiating_command_audit_ref
    constants:
      root_intent: system-manifests.import
      workflow_owner: manifest_import_coordinator
    initiating_principal_type_values: [human, service]
    invariants:
      - context_is_server_derived_from_exact_authenticated_import_request
      - activation_shares_local_postgresql_transaction_with_import
      - context_workspace_matches_subject_receipt_event_and_audit
      - application_catalog_controller_is_subject_and_receipt_actor
      - exact_initiating_principal_is_command_audit_actor
      - controller_receipt_and_initiating_principal_audit_are_both_required
      - internal_controller_scope_alone_is_not_authority
    additional_properties: false
  initiating_command_audit_v5:
    required_fields:
      - audit_id
      - workspace_id
      - action
      - initiating_principal_id
      - initiating_principal_type
      - authenticated_request_digest
      - manifest_digest
      - idempotency_key
      - transaction_id
      - recorded_at
      - audit_digest
    constants:
      action: system-manifests.import
    digest_rule: jcs-rfc8785-v1+sha256(excluding:/audit_digest)
    same_transaction_as_subject_event_and_authority_receipt: true
    additional_properties: false
  lifecycle_activation_transaction_v5:
    runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    owner_stage: R2
    production_entry_status: ENABLED_ONLY_BEHIND_AUTHENTICATED_SYSTEM_MANIFEST_IMPORT
    r2_contract_status: FROZEN_FOR_INTERNAL_CATALOG_MANIFEST_COORDINATOR
    r2_runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    r1_available_primitives:
      - closed_authority_receipt_profile
      - initiating_command_audit_profile
      - major_2_event_envelope
      - lifecycle_history_compare_and_swap
    required_artifacts:
      - exact_new_lifecycle_subject
      - major_2_event_envelope
      - controller_authority_receipt
      - manifest_activation_context
      - initiating_command_audit
      - transactional_outbox_record
    field_refs:
      controller_authority_receipt: authority_receipt_v5
      manifest_activation_context: manifest_activation_context_v5
      initiating_command_audit: initiating_command_audit_v5
    receipt_constraints:
      canonical_owner: application-catalog-controller
      allowed_commands: [applications.activate, system-components.activate]
      controller_principal: application-catalog-controller
      receipt_schema_remains_closed_without_activation_context_or_initiating_audit_fields: true
    audit_constraints:
      actor: exact_authenticated_initiating_principal
      action: system-manifests.import
      distinct_from_controller_authority_receipt: true
    transaction_constraints:
      all_required_artifacts_share_transaction_id: true
      missing_or_mismatched_artifact: REJECT_AND_ROLLBACK_ENTIRE_TRANSACTION
      audit_failure_fails_business_transaction: true
    invariants:
      - activation_subject_is_exact_new_active_lifecycle_revision
      - receipt_event_subject_and_new_lifecycle_revision_are_identical
      - receipt_actor_is_controller_and_audit_actor_is_exact_initiating_principal
      - both_authority_layers_share_exact_authenticated_import_transaction
      - neither_authority_layer_may_substitute_for_the_other
    additional_properties: false
  current_authoritative_active_system_component_binding_v5:
    r1_resolution_runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    producer_atomic_enforcement_runtime: NOT_IMPLEMENTED
    producer_owner_stage: R3
    base_profile: exact_record_binding_v5:SYSTEM_COMPONENT
    resolution_source: APPEND_ONLY_LIFECYCLE_HISTORY
    required_lifecycle_state: ACTIVE
    required_revision_rule: CURRENT_AUTHORITATIVE_ACTIVE_LIFECYCLE_REVISION_AT_RECORDING
    first_manifest_expected_revision: 2
    later_active_revision_after_deprecate_reactivate_is_allowed: true
    same_workspace_and_application_required: true
    forbidden:
      - bare_component_id
      - mutable_current_head_projection_without_exact_history
      - registered_revision
      - stale_historical_active_revision
      - deprecated_revision
      - retired_revision

profiles:
  ai_application:
    logical_resource: ai_application
    canonical_owner: application-catalog-controller
    canonical_commands: [applications.register, applications.activate, applications.archive, applications.restore]
    adds_business_state_machine: true
    state_machine_ref: contracts/v5/state-machines.yaml#machines/ai_application
    authority_profile: lifecycle_revision_authority_v5
    required_fields:
      - record_envelope
      - application_id
      - project_id
      - slug
      - display_name
      - owner_principal_ids
      - criticality
      - data_classification
      - governance_mode
      - lifecycle_state
    field_refs:
      exact_previous_application_binding_or_null: null_only
      exact_previous_application_binding: exact_record_binding_v5:AI_APPLICATION
    revision_shape_union:
      discriminator: [record_envelope.revision, lifecycle_state]
      closed_shape_rule: base_required_plus_optional_plus_selected_variant_only
      one_of:
        INITIAL_REGISTERED:
          match: {record_envelope.revision: 1, lifecycle_state: REGISTERED}
          required_fields: [exact_previous_application_binding_or_null]
          constants: {exact_previous_application_binding_or_null: null}
          forbidden_fields: [exact_previous_application_binding]
          additional_properties: false
        NON_INITIAL_TRANSITION:
          match: {record_envelope.revision: integer_min_2}
          required_fields: [exact_previous_application_binding]
          field_refs:
            exact_previous_application_binding: exact_record_binding_v5:AI_APPLICATION
          forbidden_fields: [exact_previous_application_binding_or_null]
          additional_properties: false
    initial_revision_contract:
      revision: 1
      lifecycle_state: REGISTERED
      exact_previous_application_binding_or_null: null
      command: applications.register
      event: application.registered
    activation_revision_contract:
      revision: 2
      lifecycle_state: ACTIVE
      command: applications.activate
      event: application.activated
      exact_previous_field: exact_previous_application_binding
      exact_previous_binding_required: true
      authority_profile: lifecycle_activation_transaction_v5
      r1_runtime_scope: NON_PRODUCTION_STORAGE_CAS_HARNESS_ONLY
      production_runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
      production_runtime_owner_stage: R2
    invariants:
      - every_non_initial_revision_exactly_binds_locked_previous_revision
      - every_transition_uses_same_id_previous_revision_plus_one_and_compare_and_swap
      - record_event_authority_receipt_outbox_and_audit_share_transaction
      - revision_1_remains_resolvable_after_activation
    forbidden_fields: [current_system_version_set_id, observed_runtime_state, release_status]
    additional_properties: false

  system_component:
    logical_resource: system_component
    canonical_owner: application-catalog-controller
    canonical_commands: [system-components.register, system-components.activate, system-components.deprecate, system-components.reactivate, system-components.retire]
    adds_business_state_machine: true
    state_machine_ref: contracts/v5/state-machines.yaml#machines/system_component
    authority_profile: lifecycle_revision_authority_v5
    required_fields:
      - record_envelope
      - component_id
      - application_id
      - component_kind
      - logical_name
      - owner_principal_ids
      - criticality
      - data_classification
      - permission_classification
      - effect_classification
      - lifecycle_state
    optional_fields: [dataset_role]
    field_refs:
      exact_previous_system_component_binding_or_null: null_only
      exact_previous_system_component_binding: exact_record_binding_v5:SYSTEM_COMPONENT
    revision_shape_union:
      discriminator: [record_envelope.revision, lifecycle_state]
      closed_shape_rule: base_required_plus_optional_plus_selected_variant_only
      one_of:
        INITIAL_REGISTERED:
          match: {record_envelope.revision: 1, lifecycle_state: REGISTERED}
          required_fields: [exact_previous_system_component_binding_or_null]
          constants: {exact_previous_system_component_binding_or_null: null}
          forbidden_fields: [exact_previous_system_component_binding]
          additional_properties: false
        NON_INITIAL_TRANSITION:
          match: {record_envelope.revision: integer_min_2}
          required_fields: [exact_previous_system_component_binding]
          field_refs:
            exact_previous_system_component_binding: exact_record_binding_v5:SYSTEM_COMPONENT
          forbidden_fields: [exact_previous_system_component_binding_or_null]
          additional_properties: false
    initial_revision_contract:
      revision: 1
      lifecycle_state: REGISTERED
      exact_previous_system_component_binding_or_null: null
      command: system-components.register
      event: system_component.registered
    activation_revision_contract:
      revision: 2
      lifecycle_state: ACTIVE
      command: system-components.activate
      event: system_component.activated
      exact_previous_field: exact_previous_system_component_binding
      exact_previous_binding_required: true
      authority_profile: lifecycle_activation_transaction_v5
      r1_runtime_scope: NON_PRODUCTION_STORAGE_CAS_HARNESS_ONLY
      production_runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
      production_runtime_owner_stage: R2
    current_active_rule:
      active_is_authoritative_only_when_revision_is_current_head: true
      stale_historical_active_is_not_current_authority: true
    invariants:
      - every_non_initial_revision_exactly_binds_locked_previous_revision
      - every_transition_uses_same_id_previous_revision_plus_one_and_compare_and_swap
      - record_event_authority_receipt_outbox_and_audit_share_transaction
      - revision_1_and_every_historical_revision_remain_resolvable
    forbidden_fields: [current_revision_id, observed_identity]
    additional_properties: false

  component_revision:
    logical_resource: component_revision
    canonical_owner: version-controller
    canonical_command: component-revisions.record
    adds_business_state_machine: false
    required_fields:
      - record_envelope
      - component_revision_id
      - component_id
      - exact_system_component_binding
      - component_kind
      - identity_locator
      - identity_assurance
      - configuration_digest
      - exact_provenance_receipt_bindings
    optional_fields:
      - declared_version
      - content_digest
      - provider_origin
      - resolved_at
      - immutable_provider_version_attestation
      - exact_observation_receipt_binding
      - unknown_reason
      - interface_schema_digest
      - permission_manifest_digest
      - dependency_lock_digest
      - dataset_role
      - artifact_refs
    field_refs:
      exact_system_component_binding: current_authoritative_active_system_component_binding_v5
    r1_available_primitives:
      - current_authoritative_active_history_resolution
      - exact_binding_digest_validation
      - generic_exact_record_binding_validation
    event_envelope_runtime_status: NOT_IMPLEMENTED
    event_envelope_owner_stage: R3
    writer_validation_runtime_status: NOT_IMPLEMENTED
    writer_validation_owner_stage: R3
    producer_runtime_status: NOT_IMPLEMENTED
    producer_owner_stage: R3
    r2_r3_bootstrap_producer_runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    r3_required_producer_invariants:
      - exact_system_component_binding_is_revalidated_at_recording
      - exact_system_component_binding_and_new_record_share_workspace_and_application
      - initial_manifest_binds_active_revision_2
      - later_manifest_may_bind_later_current_active_revision
      - stale_historical_active_or_non_active_binding_fails_closed
      - dependent_record_event_receipt_and_binding_validation_share_transaction
    forbidden_fields: [deployed, healthy]
    additional_properties: false

  system_candidate_revision:
    logical_resource: v4.candidate_revision
    semantic_successor_of: contracts/v4/schemas/candidate-revision.schema.json
    canonical_owner: proposal-controller
    canonical_command: candidate-revisions.record
    reuses_v4_business_state_machine: true
    adds_business_state_machine: false
    required_fields:
      - record_envelope
      - candidate_revision_id
      - candidate_kind
      - exact_case_binding
      - exact_candidate_contract_binding
      - exact_accepted_proposal_binding
      - producer_attempt_binding
      - application_id
      - environment_id
      - exact_base_system_version_set_binding
      - exact_target_system_version_set_binding
      - component_change_items
      - topology_diff_artifact
      - blast_radius_artifact
      - recovery_requirements
      - candidate_artifact_digest
    field_refs:
      exact_case_binding: exact_record_binding_v4_bridge:QUALITY_CASE
      exact_candidate_contract_binding: exact_record_binding_v4_bridge:CANDIDATE_CONTRACT
      exact_accepted_proposal_binding: exact_record_binding_v4_bridge:PROPOSAL
      producer_attempt_binding: exact_record_binding_v4_bridge:ATTEMPT
      exact_base_system_version_set_binding: exact_record_binding_v5:SYSTEM_VERSION_SET
      exact_target_system_version_set_binding: exact_record_binding_v5:SYSTEM_VERSION_SET
    constants:
      candidate_kind: SYSTEM_CHANGE
    invariants:
      - accepted_proposal_exactly_matches_candidate
      - candidate_contract_allowed_change_surface_is_enforced
      - cross_external_atomicity_is_not_claimed
      - partial_apply_stops_and_reconciles
    additional_properties: false

  system_evaluation_plan:
    logical_resource: v4.evaluation_plan
    semantic_successor_of: contracts/v4/schemas/evaluation-plan.schema.json
    canonical_owner: gate-controller
    canonical_command: evaluations.freeze-plan
    reuses_v4_business_state_machine: true
    adds_business_state_machine: false
    required_fields:
      - record_envelope
      - evaluation_plan_id
      - evaluation_purpose
      - exact_base_system_version_set_binding
      - exact_target_system_version_set_binding
      - evaluation_subject_kind
      - exact_evaluation_subject_binding
      - exact_evaluation_bundle_binding
      - exact_required_episode_snapshot_bindings
      - required_track_definitions
      - required_evaluation_dimensions
      - required_evidence_facets
      - holdout_binding_digest
      - plan_digest
    evaluation_purpose_values: [CANDIDATE_VERIFICATION, RELEASE_AUTHORIZATION]
    release_plan_binding_union:
      discriminator: evaluation_purpose
      variants:
        CANDIDATE_VERIFICATION:
          does_not_bind_release_plan: true
          forbidden_fields: [exact_release_plan_binding]
        RELEASE_AUTHORIZATION:
          required: true
          required_fields: [exact_release_plan_binding]
          exact_binds_pre_gate_sealed_release_plan: true
    field_refs:
      exact_base_system_version_set_binding: exact_record_binding_v5:SYSTEM_VERSION_SET
      exact_target_system_version_set_binding: exact_record_binding_v5:SYSTEM_VERSION_SET
      exact_evaluation_subject_binding: exact_evaluation_subject_binding_union
      exact_evaluation_bundle_binding: exact_record_binding_v5:EVALUATION_BUNDLE
      exact_release_plan_binding: exact_record_binding_v5:RELEASE_PLAN
      exact_required_episode_snapshot_bindings: list[exact_record_binding_v5:SYSTEM_EPISODE_SNAPSHOT]
    evaluation_subject_union:
      discriminator: evaluation_subject_kind
      variants:
        CANDIDATE_RELEASE:
          binding_constraint: SYSTEM_CANDIDATE_REVISION
        ROLLBACK_RECOVERY:
          binding_constraint: SYSTEM_RECOVERY_WORKORDER
          requires: [exact_prior_trusted_gate_report_binding, exact_known_good_system_version_set_binding]
    invariants:
      - base_target_candidate_bundle_and_release_plan_are_independently_exact
      - mutable_episode_view_is_forbidden_as_gate_evidence
      - generator_and_evaluator_independence_is_enforced
    additional_properties: false

  system_gate_execution:
    logical_resource: v4.gate_execution
    canonical_owner: gate-controller
    canonical_commands: [gates.start, gates.attach-track-receipt, gates.record-result, gates.reconcile]
    reuses_v4_gate_state_machine: true
    adds_business_state_machine: false
    required_fields:
      - record_envelope
      - gate_execution_id
      - lifecycle_state
      - exact_evaluation_plan_binding
      - exact_previous_gate_execution_binding_or_null
      - exact_attached_gate_track_receipt_bindings
      - exact_terminal_gate_report_binding_or_null
