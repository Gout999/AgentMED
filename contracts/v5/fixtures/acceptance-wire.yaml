version: "0.2-draft"
status: draft_contract_fixture
runtime_status: NOT_RUN
fixture_id: v5-0c-acceptance-criteria-wire

# Freeze of the acceptance-criteria propose/get/confirm wire: an Agent may
# propose an untrusted PROPOSED revision, must never confirm it, confirmation
# is reserved for a reauthenticated human maintainer or domain reviewer, the
# confirmed revision is a new immutable and additive record that references the
# prior proposed revision. V5-1C has no materialized ResolutionContract yet, so
# both proposed and confirmed revisions carry an honest pending status and the
# additive Case readiness read path remains NEEDS_ACCEPTANCE_CRITERIA.

preconditions:
  s1a_case:
    case_id: case_fixture0001
    case_revision: 1
    case_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  resolution_contract_binding_status:
    status: PENDING_MATERIALIZATION
    owner: resolution-contract-controller
    materialization_stage: V5-4
    exact_case_binding:
      case_id: case_fixture0001
      case_revision: 1
      case_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  workspace_id: ws_fixture0001

propose:
  intent: acceptance-criteria.propose
  proposer:
    principal_type: external_agent
    trust_role: null
  idempotency_key: ac-propose-0001
  expected:
    confirmation_status: PROPOSED
    is_untrusted: true
    is_authoritative: false
    resolution_contract_binding_status: PENDING_MATERIALIZATION
    exact_resolution_contract_binding_present: false
    forbids: [confirmer_principal, confirmed_at]

get:
  intent: acceptance-criteria.get
  required_query_fields: [case_revision]
  expected:
    returns_proposed_revisions_by_case_revision: true
    readiness: NEEDS_ACCEPTANCE_CRITERIA
  readiness_invariants:
    - needs_acceptance_criteria_is_projection_not_case_lifecycle
    - needs_acceptance_criteria_blocks_gate_pass_but_allows_case_investigation
    - needs_acceptance_criteria_does_not_rewrite_quality_case_payload_or_digest
    - pending_resolution_contract_materialization_cannot_project_ready

confirm:
  intent: acceptance-criteria.confirm
  confirmer:
    principal_type: human
    required_trust_roles: [maintainer, domain_reviewer]
    trust_role_source: server_registration
    reauthentication: required
  idempotency_key: ac-confirm-0001
  expected:
    confirmation_status: CONFIRMED
    is_authoritative_acceptance_input: true
    is_executable_contract: false
    new_immutable_record_not_in_place_rewrite: true
    references_prior_proposed_revision: true
    does_not_rewrite_quality_case_payload_or_digest: true
    resolution_contract_binding_status: PENDING_MATERIALIZATION
    exact_resolution_contract_binding_present: false
    readiness_after_confirm: NEEDS_ACCEPTANCE_CRITERIA
    next_action:
      code: MATERIALIZE_RESOLUTION_CONTRACT
      owner: resolution-contract-controller
      stage: V5-4

adversarial:
  - name: proposer_cannot_self_confirm
    mutation: same_principal_proposes_then_confirms
    expected: DENY_AND_AUDIT
  - name: non_human_cannot_confirm
    mutation: external_agent_or_service_principal_confirms
    expected: DENY_AND_AUDIT
  - name: confirm_requires_required_trust_role
    mutation: human_without_maintainer_or_domain_reviewer_role_confirms
    expected: DENY_AND_AUDIT
  - name: confirmed_revision_cannot_be_rewritten_in_place
    mutation: overwrite_confirmed_revision_in_place
    expected: REJECT
  - name: confirm_without_reauthentication
    mutation: confirm_skips_reauthentication
    expected: REQUEST_INVALID_AND_AUDIT

contract_grounding:
  domain_model:
    acceptance_provenance:
      case_readiness_is_projection_not_case_lifecycle: true
      target_case_readiness_values: [NEEDS_ACCEPTANCE_CRITERIA, READY]
      current_runtime_case_readiness_values: [NEEDS_ACCEPTANCE_CRITERIA]
      ready_requires_materialized_exact_resolution_contract: true
      ready_reachable_before_v5_4: false
      needs_acceptance_criteria_blocks_gate_pass: true
      needs_acceptance_criteria_allows_case_investigation: true
      needs_acceptance_criteria_does_not_rewrite_quality_case_payload_or_digest: true
      acceptance_criteria_revision:
        agent_can_propose: true
        agent_can_confirm: false
        confirmer_must_be_human_maintainer_or_domain_reviewer: true
        proposed_revision_is_untrusted: true
        confirmed_revision_is_authoritative_acceptance_input: true
        confirmed_revision_is_executable_contract: false
        confirmed_revision_references_prior_proposed_revision: true
        confirmed_revision_is_immutable_and_additive: true
    resources:
      acceptance_criteria_revision:
        kind: immutable_record
        owner: case-controller
        planned_subordinate_to: resolution_contract
        current_subordination_status: PENDING_MATERIALIZATION
        confirmation_status_union:
          variants:
            PROPOSED: {is_untrusted: true, is_authoritative: false}
            CONFIRMED:
              requires_confirmer_is_human_maintainer_or_domain_reviewer: true
              is_authoritative_acceptance_input: true
              is_executable_contract: false
      case_readiness:
        kind: projection
        commands: []
        target_readiness_values: [NEEDS_ACCEPTANCE_CRITERIA, READY]
        current_runtime_readiness_values: [NEEDS_ACCEPTANCE_CRITERIA]
  aggregate_ownership:
    record_authority:
      ACCEPTANCE_CRITERIA_REVISION:
        owner: case-controller
        command_events:
          acceptance-criteria.propose: [acceptance_criteria.proposed]
          acceptance-criteria.confirm: [acceptance_criteria.confirmed]
  intent_registry:
    intents:
      acceptance-criteria.propose:
        allowed_principal_types: [human, external_agent, service, connector]
        idempotency: required
        records_untrusted_proposal_not_confirmed_acceptance_criteria: true
      acceptance-criteria.get:
        required_query_fields: [case_revision]
      acceptance-criteria.confirm:
        allowed_principal_types: [human]
        required_trust_roles_any_of: [maintainer, domain_reviewer]
        reauthentication: required
        confirmed_revision_is_immutable_and_additive: true
        confirmed_revision_does_not_rewrite_quality_case_payload_or_digest: true
  events:
    acceptance_criteria_revision:
      events:
        acceptance_criteria.proposed:
          constants: {confirmation_status: PROPOSED}
          payload_required: [resolution_contract_binding_status]
          guards:
            - proposer_is_agent_service_or_connector_not_human_maintainer_or_domain_reviewer
            - proposed_revision_is_untrusted_and_not_authoritative
        acceptance_criteria.confirmed:
          constants: {confirmation_status: CONFIRMED}
          payload_required: [resolution_contract_binding_status]
          guards:
            - confirmer_is_human_maintainer_or_domain_reviewer
            - confirmer_is_not_the_proposer
            - confirmed_revision_is_new_immutable_record_not_in_place_rewrite
            - confirmed_revision_does_not_rewrite_quality_case_payload_or_digest
  compatibility:
    acceptance_criteria_wire:
      intents: [acceptance-criteria.propose, acceptance-criteria.get, acceptance-criteria.confirm]
      agent_can_propose: true
      proposer_cannot_self_confirm: true
      confirm_requires_human_maintainer_or_domain_reviewer: true
      reauthentication_required_on_confirm: true
      confirmed_revision_is_immutable_and_additive: true
      confirmed_revision_references_prior_proposed_revision: true
      confirmed_revision_never_rewrites_quality_case_payload_or_digest: true
      resolution_contract_binding_status:
        status: PENDING_MATERIALIZATION
        owner: resolution-contract-controller
        materialization_stage: V5-4
        exact_case_binding_required: true
        exact_resolution_contract_binding_forbidden: true
      confirmed_revision_is_authoritative_acceptance_input: true
      confirmed_revision_is_executable_contract: false
      readiness_read_path: NEEDS_ACCEPTANCE_CRITERIA
      readiness_blocks_gate_pass_but_allows_case_investigation: true
      confirmed_pending_materialization_stays_needs_acceptance_criteria: true
      ready_requires_v5_4_materialized_resolution_contract: true

does_not_prove:
  - acceptance_route_implemented
  - readiness_projection_implemented
  - gate_pass_blocking_implemented
  - any_runtime_behavior
