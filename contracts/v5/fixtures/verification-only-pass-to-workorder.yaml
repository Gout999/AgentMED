version: "0.1-draft"
status: draft_contract_fixture
runtime_status: NOT_RUN
fixture_id: v5-verification-only-pass-to-workorder

# Adversarial fixture: a CANDIDATE_VERIFICATION Gate PASS must NOT create a
# SystemWorkOrder. The only legal reaction to a verification-only PASS is the
# read-only VerifiedCandidate projection plus a RegressionAsset closure
# artifact, with deployment status NOT_DEPLOYED. Any attempt to mint a
# WorkOrder from that PASS is rejected and audited; the PASS cannot be
# renamed or reused as release authority.

preconditions:
  evaluation_purpose: CANDIDATE_VERIFICATION
  evaluation_phase: PRE_RELEASE
  gate_verdict: PASS
  evidence_completeness: COMPLETE
  every_exact_required_track_complete_and_pass: true
  release_plan_sealed: false
  exact_candidate_binding:
    kind: SYSTEM_CANDIDATE_REVISION
    revision: 1
  exact_verification_gate_report_binding:
    kind: SYSTEM_GATE_REPORT
    revision: 1

attempted:
  command: workorders.create-from-pass
  allowed_principal_types: [internal_controller]
  source_events: [gate.completed, gate.reconciled_pass]
  gate_purpose_at_attempt_time: CANDIDATE_VERIFICATION

expected_outcome:
  result: REJECT_AND_AUDIT
  rejection_rules:
    - gate_terminal_pass_to_workorder_forbidden_when_gate_purpose_CANDIDATE_VERIFICATION
    - candidate_verification_pass_cannot_create_workorder
    - candidate_verification_gate_does_not_bind_release_plan
  legal_reaction_instead:
    produces: [verified_candidate, regression_asset]
    deployment_status: NOT_DEPLOYED
    does_not_claim_deployment: true
  forbidden_downstream:
    - workorder_created
    - release_authorization_claimed_from_verification_pass
    - deployment_claimed_from_verification_pass
    - prior_verification_pass_reused_as_release_authority

contract_grounding:
  aggregate_ownership:
    gate_controller_same_owner_workflows:
      gate_terminal_pass_to_workorder:
        command: workorders.create-from-pass
        source_condition: gate_purpose_RELEASE_AUTHORIZATION_and_exact_PASS
        forbidden_when_gate_purpose: CANDIDATE_VERIFICATION
      candidate_verification_pass_to_verified_candidate:
        source_condition: gate_purpose_CANDIDATE_VERIFICATION_and_exact_PASS
        forbidden_command: workorders.create-from-pass
        produces: [verified_candidate, regression_asset]
        does_not_claim_deployment: true
        deployment_status_for_library_or_offline: NOT_DEPLOYED
  domain_model:
    gate_purposes:
      values: [CANDIDATE_VERIFICATION, RELEASE_AUTHORIZATION]
      candidate_verification:
        pass_produces: [verified_candidate, regression_asset]
        cannot_create_workorder: true
        cannot_claim_deployment: true
        does_not_bind_release_plan: true
      release_authorization:
        pass_is_only_path_to_workorder: true
        exact_binds_pre_gate_sealed_release_plan: true
      invariants:
        - verification_only_pass_cannot_create_workorder
        - only_release_authorization_pass_creates_workorder
        - release_authorization_requires_pre_gate_sealed_release_plan
        - verified_candidate_cannot_be_renamed_to_release_authorization
        - post_release_gate_does_not_create_workorder
    resources:
      verified_candidate:
        kind: projection
        commands: []
        invariants:
          - verified_candidate_is_read_only_projection_of_candidate_and_verification_pass
          - verified_candidate_does_not_own_lifecycle_or_commands
          - verified_candidate_does_not_claim_deployment
          - reusing_verified_candidate_as_release_authority_is_forbidden
          - release_requires_new_release_authorization_gate_not_prior_verification_pass
  schema_profiles:
    system_workorder:
      invariants:
        - created_only_from_exact_trustworthy_gate_pass
    system_gate_report:
      invariants:
        - failed_inconclusive_error_unknown_cannot_create_system_workorder
  state_machines:
    cross_domain_rules:
      gate_non_pass_cannot_create_system_workorder: true

does_not_prove:
  - workorder_creation_path_implemented
  - release_authorization_chain_implemented
  - any_runtime_behavior
