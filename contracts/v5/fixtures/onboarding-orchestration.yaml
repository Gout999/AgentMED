version: "0.2-draft"
status: draft_contract_fixture
runtime_status: NOT_RUN
fixture_id: v5-0c-onboarding-workflow-orchestration

# Freeze of the CLI onboarding workflow semantics: `agentmed init <repo>` and
# `agentmed case from-issue <github-url>` only orchestrate canonical intents.
# Network disconnects, partial failures, and retries never produce a second
# owner, a duplicate Case, or an automatically confirmed acceptance.

workflows:
  agentmed_init:
    invocation: "agentmed init <repo>"
    steps:
      - local_read_only_discovery
      - manifest_draft
      - human_confirmation
      - canonical_manifest_import
    canonical_intents:
      - capabilities.get
      - system-manifests.import
    forbidden:
      - bypass_human_confirmation
      - write_discovery_results_as_authority
      - partial_import_leaving_orphan_objects

  agentmed_case_from_issue:
    invocation: "agentmed case from-issue <github-url>"
    steps:
      - issue_snapshot
      - signal_submit
      - case_open
      - application_binding
      - acceptance_criteria_draft
    canonical_intents:
      - signals.submit
      - cases.open-from-signal
      - cases.bind-application
      - acceptance-criteria.propose
    forbidden:
      - auto_confirm_acceptance
      - create_second_owner
      - create_duplicate_case_on_retry

# The block above preserves the V5-0C target orchestration freeze. The current
# CLI implementation is narrower and is recorded additively here.
runtime_overlay:
  through_delivery_slice: V5-1C
  agentmed_init:
    invocation: "agentmed init <repo>"
    steps: [local_read_only_discovery, manifest_draft]
    writes_server_state: false
    import_is_a_separate_operator_command: true
    next_commands:
      - system-manifest validate
      - system-manifest import
  agentmed_case_from_issue:
    invocation: "agentmed case from-issue <github-url>"
    steps:
      - issue_snapshot
      - application_read
      - environment_read
      - signal_submit_and_case_open
      - exact_case_read
      - optional_version_read
      - application_binding
      - acceptance_criteria_draft
    canonical_intents:
      - applications.get
      - environments.get
      - signals.submit
      - acceptance-criteria.get
      - system-versions.get
      - cases.bind-application
      - acceptance-criteria.propose
    auto_confirm_acceptance: false
    readiness_after_draft: NEEDS_ACCEPTANCE_CRITERIA
    conditional_intents:
      system-versions.get: only_when_operator_selects_system_version_set_id

retry_safety:
  idempotency_keys_reused_on_retry: true
  no_second_owner_on_retry: true
  no_duplicate_case_on_retry: true
  no_auto_confirmed_acceptance: true
  lost_response_recovers_via_authoritative_read_intent: true

contract_grounding:
  compatibility:
    onboarding_workflow_orchestration:
      agentmed_init:
        steps: [local_read_only_discovery, manifest_draft]
        writes_server_state: false
        import_is_a_separate_operator_command: true
        separate_import_intent: system-manifests.import
      agentmed_case_from_issue:
        steps: [issue_snapshot, application_read, environment_read, signal_submit_and_case_open, exact_case_read, optional_version_read, application_binding, acceptance_criteria_draft]
        canonical_intents_only: true
        no_auto_confirmation: true
        readiness_after_draft: NEEDS_ACCEPTANCE_CRITERIA
      retry_safety:
        no_second_owner_on_retry: true
        no_duplicate_case_on_retry: true
        no_auto_confirmed_acceptance: true
  intent_registry:
    intents:
      capabilities.get: {kind: query}
      system-manifests.import: {kind: mutation, transaction_semantics: ALL_OR_NOTHING_LOCAL_POSTGRES}
      cases.bind-application: {kind: mutation, idempotency: required}
      acceptance-criteria.propose:
        kind: mutation
        idempotency: required
        records_untrusted_proposal_not_confirmed_acceptance_criteria: true
    first_slice_wire_contract:
      idempotency_contract:
        mutation_idempotency_key_required: true
        same_key_same_request: RETURN_SAME_RECORD_AND_RESPONSE
        same_key_different_request: CONFLICT_AND_AUDIT
        replay_creates_no_second_record: true
        replay_does_not_duplicate_cross_owner_reaction: true
  v4_intent_registry:
    signals.submit: {kind: mutation, idempotency: required}
    cases.open-from-signal: {kind: mutation, idempotency: required}

does_not_prove:
  - cli_command_implemented
  - github_integration_implemented
  - signal_or_case_runtime_path_implemented
  - any_runtime_behavior
