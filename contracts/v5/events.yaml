r2_application_catalog_contract:
  stage: R2
  contract_status: FROZEN_FOR_IMPLEMENTATION
  runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
  internal_catalog_manifest_writer:
    contract_status: ENABLED_ONLY_BEHIND_COORDINATOR
    runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    workflow_owner: manifest_import_coordinator
    authenticated_root_intent: system-manifests.import
    required_event_types:
      - application.registered
      - application.activated
      - environment.registered
      - system_component.registered
      - system_component.activated
      - dependency_edge.recorded
      - component_revision.recorded
      - topology_revision.recorded
      - system_version_set.recorded
      - bootstrap_attestation.recorded
      - system_assignment.recorded
    every_event_uses_major_2_exact_subject_envelope: true
    activation_event_requires_exact_previous_and_new_binding: true
    event_outbox_subject_receipt_and_controller_audit_share_transaction: true
    initiating_principal_audit_shares_root_transaction: true
    component_revision_bootstrap_producer_guards:
      exact_system_component_binding: CURRENT_AUTHORITATIVE_ACTIVE_REVISION_2
      resolution_source: LOCKED_APPEND_ONLY_LIFECYCLE_HISTORY
      component_revision_event_and_record_share_atomic_transaction: true
      stale_registered_or_client_supplied_binding: FORBIDDEN
    bootstrap_only_constraints:
      scope: WORKSPACE_INITIAL_ONE_SHOT
      all_authoritative_v5_domain_tables_empty: REQUIRED
      initial_system_version_set_count: 1
      system_assignment_generation: 1
      replay_requires_same_idempotency_key_and_same_canonical_body: true
      same_key_same_body_replay_emits_zero_new_events_or_facts: true
      different_key_even_same_manifest_digest: CONFLICT_WITH_ZERO_NEW_FACTS
      standalone_system_versions_record_event: FORBIDDEN
      second_workspace_bootstrap_version_or_diff_event_claim: FORBIDDEN
  production_public_intent_events:
    capabilities.get: []
    applications.register: [application.registered]
    applications.get: []
    applications.list: []
    environments.register: [environment.registered]
    environments.get: []
    system-components.register: [system_component.registered]
    system-components.get: []
    dependency-edges.record: [dependency_edge.recorded]
    dependency-edges.get: []
    system-manifests.import:
      - application.registered
      - application.activated
      - environment.registered
      - system_component.registered
      - system_component.activated
      - dependency_edge.recorded
      - component_revision.recorded
      - topology_revision.recorded
      - system_version_set.recorded
      - bootstrap_attestation.recorded
      - system_assignment.recorded
  public_register_event_state: REGISTERED
  internal_manifest_result_event_state: ACTIVE
  standalone_activation_event_routes:
    http: FORBIDDEN
    cli: FORBIDDEN
    sdk: FORBIDDEN
    mcp: FORBIDDEN
    a2a: FORBIDDEN
    capability_discovery: FORBIDDEN
  r3_bootstrap_event_writers:
    contract_status: FROZEN_ONLY_INSIDE_BOOTSTRAP_SYSTEM_MANIFEST
    runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
    complete_one_shot_first_graph_producer: true
    component_revision_exact_current_active_component_revision_2_binding: REQUIRED
  r3_full_and_r4_event_writers_remain: NOT_IMPLEMENTED

d2_complete_version_graph_contract:
  stage: D2
  plan_ref: docs/plans/v5-master-execution-plan.md#17.3
  contract_status: FROZEN_FOR_IMPLEMENTATION
  implementation_status: NOT_IMPLEMENTED
  frozen_intents: [system-versions.record, system-versions.get, system-versions.diff]
  activation_status: NOT_ACTIVATED
