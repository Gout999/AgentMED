  standalone_record_event_contract:
    event: system_version_set.recorded
    event_version: "2.0"
    exact_subject_envelope: true
    exact_previous_system_version_set_binding_included_from_second_version: true
    event_outbox_subject_receipt_and_controller_audit_share_transaction: true
    initiating_principal_audit_shares_root_transaction: true
    record_event_and_outbox_share_atomic_transaction: true
  standalone_record_event_never_claims_diff_or_observed_state: true

v5_2a_work_kernel_contract:
  stage: V5-2A-0
  plan_ref: docs/plans/v5-master-execution-plan.md#6
  decision_ref: docs/decisions/D-016-v5-work-event-schema-major-routing.md
  contract_status: FROZEN_FOR_IMPLEMENTATION
  implementation_status: NOT_IMPLEMENTED
  activation_status: NOT_ACTIVATED
  # D-016: Work events use the major-2 envelope while reusing the V4 semantic
  # owner and state machines.  This is the `semantic_reuse_with_schema_major_routing`
  # mode that contracts/v5/aggregate-ownership.yaml already declares for
  # worker_task / attempt / proposal / proposal_decision / capability_lease /
  # external_operation.  V4 payload bytes and V4 history are never reinterpreted.
  schema_major_routing:
    mode: semantic_reuse_with_schema_major_routing
    ownership_source: contracts/v4/aggregate-ownership.yaml
    state_machine_source: contracts/v4/events/state-machines.yaml
    no_state_machine_copy: true
    closed_json_schemas_are_not_inherited: true
    v5_work_events_use_envelope: event_envelope_v5
    v4_work_events_remain_addressable_under_contract_version_v4: true
    same_aggregate_may_not_mix_majors_within_one_transaction: true
  reused_v4_semantic_owners:
    worker_task: work-controller
    attempt: work-controller
    proposal: proposal-controller
    proposal_decision: proposal-controller
    capability_lease: capability-controller
    external_operation: scoped-executor-controller
  # Writers that may never own domain success for the Work aggregates.  A
  # receipt, projection, export or adapter acknowledgement is not success.
  forbidden_writers:
    coordinator:
      may: [compose_owner_commands_in_one_transaction]
      may_not: [append_domain_event, write_worker_task_or_attempt_row, issue_authority_receipt]
    executor:
      may: [report_attempt_receipt_and_output]
      may_not: [append_domain_event, decide_terminal_state, write_worker_task_row]
    adapter:
      may: [deliver_outbox_message, return_delivery_receipt]
      may_not: [append_domain_event, imply_domain_success, mutate_aggregate_state]
    exporter:
      may: [read_committed_facts]
      may_not: [append_domain_event, write_any_aggregate_row, create_authority_receipt]

  frozen_event_catalog:
    worker_task:
      - work.requested
      - work.claimed
      - work.heartbeat_recorded
      - work.retry_scheduled
      - work.cancel_requested
      - work.cancelled
      - work.completed
      - work.exhausted
      - work.blocked_unknown
      - work.unknown_reconciled_retry
      - work.unknown_reconciled_completed
    attempt:
      - attempt.created
      - attempt.starting
      - attempt.started
      - attempt.receipt_recorded
      - attempt.output_recorded
      - attempt.succeeded
      - attempt.failed
      - attempt.timed_out
      - attempt.cancel_requested
      - attempt.cancelled
      - attempt.unknown
      - attempt.reconciled_succeeded
      - attempt.reconciled_failed
    proposal: [proposal.submitted]
    proposal_decision: [proposal.accepted, proposal.rejected]
  claim_transaction_contract:
    # Master §6 2A-2: one PostgreSQL unit of work or nothing at all.
    same_transaction_required:
      - fixed_task_snapshot
      - attempt_row_created
      - attempt_scoped_runtime_capability_issued
      - authority_receipt_recorded
      - domain_event_appended
      - controller_audit_recorded
      - outbox_row_enqueued
    any_step_failure_rolls_back_whole_claim: true
    dual_lease_authority_forbidden: true
    v3_case_lease_to_work_lease_requires_explicit_cutover: true
  fencing_contract:
    lease_carries_monotonic_fence_token: true
    stale_fence_write_is_rejected_not_ignored: true
    heartbeat_may_not_extend_a_lost_lease: true
    late_receipt_after_lease_loss_is_rejected: true
    ambiguous_attempt_outcome_is_unknown: true
    unknown_requires_reconcile_before_retry: true
  reaction_ledger_contract:
    reaction_may_only_submit_next_owner_command: true
    reaction_may_not_write_domain_success: true
    per_aggregate_causal_order_preserved: true
    consumer_idempotency_required: true
    retry_and_dlq_are_explicit: true
  ghost_success_rules:
    decision_without_first_downstream_intent_is_rejected: true
    proposal_accept_writes_decision_downstream_audit_and_outbox_in_one_transaction: true
    wrapper_success_without_valid_output_is_failure: true
    post_action_proposal_is_rejected: true
  transports:
    http: FORBIDDEN
    cli: FORBIDDEN
    sdk: FORBIDDEN
    mcp: FORBIDDEN
    a2a: FORBIDDEN
    capability_discovery: FORBIDDEN
  does_not_prove:
    - agent_causal_or_provider_live_execution
    - public_route_or_transport_activation
    - v5_2b_async_public_intents
    - production_canary_or_external_write

v5_2b_public_operation_contract:
  stage: V5-2B
  plan_ref: docs/plans/v5-master-execution-plan.md#v5-2b--async-public-intents
  contract_status: FROZEN_FOR_IMPLEMENTATION
  implementation_status: IMPLEMENTED_PENDING_VERIFIER
  activation_status: ACTIVATED_LOCAL
  projection_creates_business_state_machine: false
  operation_state_derives_only_from: [v4.worker_task, v4.attempt, trusted_domain_artifact]
  automation_request:
    owner: automation-request-controller
    events:
      - automation_request.investigation_submitted
      - automation_request.stop_requested
  semantics:
    detach_cancels_work: false
    cancel_is_stop_request_not_terminal_success: true
    completed_means_trusted_artifact_not_gate_or_release_pass: true

event_envelope_v5:
  applies_to: every_event_in_this_major_2_catalog
  required_fields: [event_id, event_type, event_version, event_contract_major, workspace_id, transaction_id, occurred_at, actor_principal, correlation_id, causation_id, routing_key, exact_subject_binding, authority_receipt_id, payload, payload_digest]
  constants:
    event_contract_major: 2
  routing_key_fields: [contract_major, resource_kind, subject_id]
  exact_subject_binding_profile: contracts/v5/schema-profiles.yaml#common/exact_record_binding_v5
  subject_binding_is_the_post_event_immutable_revision: true
  outbox_carries_envelope_without_rebinding_current_state: true
  payload_digest_rule: jcs-rfc8785-v1+sha256(payload)
  authority_receipt_must_share_event_subject_transaction_actor_and_command: true
  lifecycle_revision_rules:
    exact_subject_binding: exact_new_post_event_lifecycle_revision
    exact_previous_binding: payload_only_and_server_derived_from_locked_authoritative_history
    previous_and_new_share_kind_id_and_workspace: true
    new_revision_equals_previous_revision_plus_one: true
    new_record_digest_is_independently_canonical: true
    current_head_projection_is_not_event_or_binding_authority: true

rules:
  v4_event_payloads_are_not_reinterpreted: true
  v5_release_chain_events_use_explicit_major_2_envelopes: true
  catalog_event_payloads_must_be_frozen_before_route_activation: true
  event_and_subject_authority_receipt_share_transaction: true
  adapter_receipt_does_not_imply_domain_success: true
  ambiguous_external_outcome_is_unknown: true
  authority_fields_are_carried_forward_from_exact_previous_aggregate_revision: true
  lifecycle_events_are_append_only_and_never_rebind_historical_envelopes: true
  activation_events_require_manifest_import_transaction_authority: true
  dependent_record_events_revalidate_current_authoritative_active_binding: true

system_release_sequence:
  ordered_authority:
    - candidate_revision.recorded
    - release_plan.frozen
    - evaluation.plan_frozen
    - gate_terminal_pass
    - workorder.created
    - approval.requested
    - approval.decided_approved
    - capability.issued
    - capability.consumed_and_external_operation.requested_same_transaction
    - external_operation.started
    - operation_execution_receipt.recorded
    - system_assignment.desired_updated
    - observed_state.recorded
    - post_release_evaluation.plan_frozen
    - post_release_gate_terminal
    - external_operation.succeeded_or_unknown
  forbidden_orderings:
    - release_plan_frozen_after_approval
    - workorder_created_before_gate_pass
    - operation_requested_before_human_approval
    - operation_succeeded_from_adapter_receipt_only

ai_application:
  events:
    application.registered:
      event_version: "2.0"
      payload_required: [exact_previous_application_binding_or_null, exact_application_binding, project_id, slug, lifecycle_state]
      constants: {lifecycle_state: REGISTERED}
      guards:
        - exact_previous_application_binding_or_null_is_null
        - exact_application_binding_is_revision_1
        - event_envelope_exact_subject_binding_equals_exact_application_binding
    application.activated:
      event_version: "2.0"
      composed_runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
      composed_runtime_owner_stage: R2
      production_route_status: DISABLED
      direct_production_append: FORBIDDEN
      r1_validation_scope: STRUCTURAL_CONTRACT_ONLY_NON_PRODUCTION
      r2_internal_writer_contract_status: ENABLED_ONLY_BEHIND_COORDINATOR
      r2_internal_writer_runtime_status: IMPLEMENTED_PENDING_POST_COMMIT_VERIFIER
      standalone_event_route_status: FORBIDDEN
      payload_required: [exact_previous_application_binding, exact_application_binding, lifecycle_state, manifest_activation_context, initiating_command_audit_ref]
      constants: {lifecycle_state: ACTIVE}
      guards:
        - exact_previous_application_binding_is_locked_current_registered_revision_1
        - exact_application_binding_is_new_revision_2
        - event_envelope_exact_subject_binding_equals_exact_application_binding
        - manifest_activation_context_is_exact_authenticated_system_manifest_import
        - initiating_command_audit_ref_equals_manifest_activation_context_audit_ref
        - application_catalog_controller_receipt_and_initiating_principal_audit_share_transaction
        - direct_public_or_internal_controller_activation_is_forbidden
    application.archived:
      event_version: "2.0"
      runtime_status: NOT_IMPLEMENTED
      runtime_owner_stage: R2
      payload_required: [exact_previous_application_binding, exact_application_binding, archive_reason, lifecycle_state]
      constants: {lifecycle_state: ARCHIVED}
      guards:
        - exact_previous_binding_is_locked_current_authoritative_revision
        - exact_application_binding_is_new_adjacent_revision
        - event_envelope_exact_subject_binding_equals_exact_application_binding
    application.restored:
      event_version: "2.0"
      runtime_status: NOT_IMPLEMENTED
      runtime_owner_stage: R2
      payload_required: [exact_previous_application_binding, exact_application_binding, lifecycle_state]
      constants: {lifecycle_state: ACTIVE}
      guards:
        - exact_previous_binding_is_locked_current_authoritative_revision
        - exact_application_binding_is_new_adjacent_revision
        - event_envelope_exact_subject_binding_equals_exact_application_binding

