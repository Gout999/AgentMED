openapi: 3.1.0
info:
  title: AgentMED Public API
  version: 1.0.0
  description: >-
    Stage-aware v4 public contract. This document contains only FROZEN S1A/S1B
    operations. The Intent Registry also catalogs later SKELETON intents, but
    those must not generate routes, CLI discovery, SDK methods, or capability
    advertisements until their own field contract and implementation gate pass.
servers:
  - url: /
security:
  - BearerAuth: []
x-agentmed-intent-registry: ../intent-registry.yaml
x-agentmed-auth-order:
  - validate_bearer_without_trusting_workspace_header
  - resolve_principal_and_active_nonrevoked_credential
  - bind_requested_workspace_project_environment
  - authorize_required_scope
x-agentmed-error-rules:
  auth_before_workspace_uses_null_workspace: true
  audit_failure_uses_null_audit_ref_and_rolls_back: true

paths:
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      x-agentmed-intent: capabilities.get
      x-agentmed-scope: capabilities:read
      x-agentmed-wire-status: FROZEN
      x-agentmed-delivery-slice: S1A
      x-agentmed-activation-stage: 1
      x-agentmed-discovery-filter: FROZEN_AND_IMPLEMENTED_AND_AUTHORIZED
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Enabled capabilities for this exact principal and workspace; SKELETON intents are excluded.
          headers:
            X-AgentMED-Contract-Version: {$ref: '#/components/headers/ContractVersion'}
          content:
            application/json:
              schema: {$ref: '../schemas/public-api-wire.schema.json#/$defs/server_capabilities_response'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/PublicError'}

  /api/v1/signals:
    post:
      operationId: submitSignal
      x-agentmed-intent: signals.submit
      x-agentmed-scope: signals:write
      x-agentmed-wire-status: FROZEN
      x-agentmed-delivery-slice: S1A
      x-agentmed-activation-stage: 1
      x-agentmed-source-guard: workspace-bound ACTIVE SourceConnection
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/public-api-wire.schema.json#/$defs/signal_submission'}
      responses:
        '201':
          description: >-
            Signal, OPEN Case, link, UNKNOWN/PARTIAL/COMPLETE evidence and immutable
            idempotency receipt committed atomically. NO_LOCATOR never creates an AgentRunRef.
          headers:
            X-AgentMED-Contract-Version: {$ref: '#/components/headers/ContractVersion'}
          content:
            application/json:
              schema: {$ref: '../schemas/public-api-wire.schema.json#/$defs/signal_submission_response'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/PublicError'}

  /api/v1/cases/{case_id}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      operationId: getCase
      x-agentmed-intent: cases.get
      x-agentmed-scope: cases:read
      x-agentmed-wire-status: FROZEN
      x-agentmed-delivery-slice: S1A
      x-agentmed-activation-stage: 1
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Exact workspace-bound QualityCase view.
          headers:
            X-AgentMED-Contract-Version: {$ref: '#/components/headers/ContractVersion'}
          content:
            application/json:
              schema: {$ref: '../schemas/public-api-wire.schema.json#/$defs/case_response'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/PublicError'}

  /api/v1/cases/{case_id}/timeline:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      operationId: getCaseTimeline
      x-agentmed-intent: cases.timeline
      x-agentmed-scope: cases:read
      x-agentmed-wire-status: FROZEN
      x-agentmed-delivery-slice: S1A
      x-agentmed-activation-stage: 1
      x-agentmed-cursor-binding: workspace_id+case_id+order+filter+watermark
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Stable snapshot page; appends after the watermark cannot duplicate or skip entries.
          headers:
            X-AgentMED-Contract-Version: {$ref: '#/components/headers/ContractVersion'}
          content:
            application/json:
              schema: {$ref: '../schemas/public-api-wire.schema.json#/$defs/case_timeline_response'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/PublicError'}

  /api/v1/evidence/{receipt_id}:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    get:
      operationId: getEvidence
      x-agentmed-intent: evidence.get
      x-agentmed-scope: artifacts:read
      x-agentmed-wire-status: FROZEN
      x-agentmed-delivery-slice: S1A
      x-agentmed-activation-stage: 1
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Exact immutable TraceEvidenceReceipt view.
          headers:
            X-AgentMED-Contract-Version: {$ref: '#/components/headers/ContractVersion'}
          content:
            application/json:
              schema: {$ref: '../schemas/public-api-wire.schema.json#/$defs/evidence_response'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/PublicError'}

  /api/v1/sources/{source_id}/capabilities:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      operationId: getSourceCapabilities
      x-agentmed-intent: sources.capabilities
      x-agentmed-scope: sources:read
      x-agentmed-wire-status: FROZEN
      x-agentmed-delivery-slice: S1B
      x-agentmed-activation-stage: 1
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Exact latest immutable capability snapshot.
          headers:
            X-AgentMED-Contract-Version: {$ref: '#/components/headers/ContractVersion'}
          content:
            application/json:
              schema: {$ref: '../schemas/public-api-wire.schema.json#/$defs/source_capabilities_response'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/PublicError'}

  /api/v1/sources/{source_id}:doctor:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    post:
      operationId: doctorSource
      x-agentmed-intent: sources.doctor
      x-agentmed-scope: sources:manage
      x-agentmed-wire-status: FROZEN
      x-agentmed-delivery-slice: S1B
      x-agentmed-activation-stage: 1
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/public-api-wire.schema.json#/$defs/source_doctor_request'}
      responses:
        '202':
          description: Durable SourceSyncRun accepted; provider failure becomes a queryable terminal domain status.
          headers:
            X-AgentMED-Contract-Version: {$ref: '#/components/headers/ContractVersion'}
          content:
            application/json:
              schema: {$ref: '../schemas/public-api-wire.schema.json#/$defs/source_doctor_response'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/PublicError'}

  /api/v1/source-sync-runs/{source_sync_run_id}:
    parameters:
      - $ref: '#/components/parameters/SourceSyncRunId'
    get:
      operationId: getSourceSyncRun
      x-agentmed-intent: source-sync-runs.get
      x-agentmed-scope: sources:read
      x-agentmed-wire-status: FROZEN
      x-agentmed-delivery-slice: S1B
      x-agentmed-activation-stage: 1
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Durable SourceSyncRun status, including FAILED or UNKNOWN without converting it to HTTP 500.
          headers:
            X-AgentMED-Contract-Version: {$ref: '#/components/headers/ContractVersion'}
          content:
            application/json:
              schema: {$ref: '../schemas/public-api-wire.schema.json#/$defs/source_sync_run_response'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/PublicError'}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        The credential is resolved server-side into the accepted principal
        context below. Raw token and raw jti are never persisted or echoed.
      x-agentmed-accepted-context: ../schemas/public-principal-context.schema.json

  parameters:
    WorkspaceId:
      name: X-AgentMED-Workspace-ID
      in: header
      required: true
      description: Requested workspace. It is accepted only after bearer claims bind the same workspace.
      schema:
        type: string
        pattern: '^ws_[0-9A-Za-z]{8,64}$'
    ContractVersion:
      name: X-AgentMED-Contract-Version
      in: header
      required: true
      description: Exact public field contract. Unsupported versions fail with 412 CONTRACT_VERSION_UNSUPPORTED.
      schema: {type: string, const: '1.0'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema: {type: string, pattern: '^req_[0-9A-Za-z]{8,64}$'}
    ClientVersion:
      name: X-AgentMED-Client-Version
      in: header
      required: false
      schema: {type: string, minLength: 1, maxLength: 128}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque authenticated cursor bound to workspace, case, order, filter and snapshot watermark.
      schema: {type: string, pattern: '^cur_[0-9A-Za-z_-]{8,512}$'}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    CaseId:
      name: case_id
      in: path
      required: true
      schema: {type: string, pattern: '^case_[0-9A-Za-z]{8,64}$'}
    ReceiptId:
      name: receipt_id
      in: path
      required: true
      schema: {type: string, pattern: '^ter_[0-9A-Za-z]{8,64}$'}
    SourceId:
      name: source_id
      in: path
      required: true
      schema: {type: string, pattern: '^src_[0-9A-Za-z]{8,64}$'}
    SourceSyncRunId:
      name: source_sync_run_id
      in: path
      required: true
      schema: {type: string, pattern: '^ssr_[0-9A-Za-z]{8,64}$'}

  headers:
    ContractVersion:
      required: true
      schema: {type: string, const: '1.0'}

  responses:
    BadRequest: {$ref: '#/components/responses/PublicError'}
    Unauthorized: {$ref: '#/components/responses/PublicError'}
    Forbidden: {$ref: '#/components/responses/PublicError'}
    NotFound: {$ref: '#/components/responses/PublicError'}
    Conflict: {$ref: '#/components/responses/PublicError'}
    PreconditionFailed: {$ref: '#/components/responses/PublicError'}
    ContentTooLarge: {$ref: '#/components/responses/PublicError'}
    UnsupportedMediaType: {$ref: '#/components/responses/PublicError'}
    UnprocessableEntity: {$ref: '#/components/responses/PublicError'}
    RateLimited:
      description: Rate limited; PublicError.retry_after_ms is non-null.
      headers:
        X-AgentMED-Contract-Version: {$ref: '#/components/headers/ContractVersion'}
        Retry-After: {schema: {type: integer, minimum: 0}}
      content:
        application/json:
          schema: {$ref: '../schemas/public-error.schema.json'}
    ServiceUnavailable: {$ref: '#/components/responses/PublicError'}
    PublicError:
      description: Machine-readable failure. Workspace or audit reference is null when it was not authoritatively resolved/committed.
      headers:
        X-AgentMED-Contract-Version: {$ref: '#/components/headers/ContractVersion'}
      content:
        application/json:
          schema: {$ref: '../schemas/public-error.schema.json'}
