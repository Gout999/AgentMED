# AgentMED 控制台 nginx 配置（T7）
# 静态托管 + SPA 回退 + 数据通路反代（冻结）：/api/* → http://control-plane:8090/
# 由 deploy/compose.yaml 的 console 服务挂载到 /etc/nginx/conf.d/default.conf

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA 路由回退（/cases/:id、/experiments/:id 等深链）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 数据通路（冻结）：console 只调相对路径 /api/*；此处反代到 control-plane（compose 内网）
    # 尾斜杠会剥掉 /api 前缀：/api/v1/cases → http://control-plane:8090/v1/cases
    location /api/ {
        proxy_pass http://control-plane:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
