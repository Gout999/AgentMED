# CaseLoop 演示环境骨架（T2 先出 PG；T1 在此追加 demo-app 服务）
# 用法：
#   docker compose -f deploy/compose.yaml up -d postgres
# 三逻辑库：control_plane / demo_app / casebase（见 postgres/init）

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: caseloop-postgres
    environment:
      POSTGRES_USER: caseloop
      POSTGRES_PASSWORD: caseloop
      # 默认库；init 脚本再创建 control_plane/demo_app/casebase
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - caseloop_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseloop -d control_plane"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ---- T1 demo-app「小智客服」（被治理应用）—— 仅 APPEND，不重构 control-plane 骨架 ----
  demo-app:
    build:
      context: ../demo-app
    container_name: caseloop-demo-app
    environment:
      DATABASE_URL: postgresql+psycopg://caseloop:caseloop@postgres:5432/demo_app
      STEPFUN_API_KEY: ${STEPFUN_API_KEY:-}
      STEPFUN_BASE_URL: ${STEPFUN_BASE_URL:-https://api.stepfun.com/step_plan/v1}
      STEPFUN_MODEL: step-3.7-flash
      CASELOOP_READ_TOKEN: ${CASELOOP_READ_TOKEN:-conformance-read-token}
      CASELOOP_WRITE_TOKEN: ${CASELOOP_WRITE_TOKEN:-conformance-write-token}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LLM_RPM_LIMIT: "8"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---- Wave 3：control-plane 服务化（确定性控制面）—— 仅 APPEND，不动上方服务 ----
  control-plane:
    build:
      context: ../control-plane
    container_name: caseloop-control-plane
    environment:
      # compose 内部网络：直连 postgres 容器（宿主映射见 ports）
      DATABASE_URL: postgresql+psycopg://caseloop:caseloop@postgres:5432/control_plane
      # 被治理应用 Quality API（写面唯一入口）；容器内 127.0.0.1 不是 demo-app
      QUALITY_API_BASE_URL: http://demo-app:8080
      QUALITY_API_TOKEN: ${CASELOOP_WRITE_TOKEN:-conformance-write-token}
    ports:
      - "18090:8090"   # 宿主 8090 被占用，映射到 18090
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- T7：console 运营后台（评委看板）—— 仅 APPEND，不动上方服务 ----
  console:
    build:
      context: ../console
    container_name: caseloop-console
    ports:
      - "8088:80"
    volumes:
      # 数据通路（冻结）：nginx 反代 /api/ → control-plane:8090（compose 内网）
      - ./nginx-console.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caseloop_pgdata:
    name: caseloop_pgdata
