# AgentMED 本地演示环境。宿主端口默认只绑定 127.0.0.1；显式修改
# AGENTMED_BIND_HOST 才会暴露到其他网络接口。
# 用法：
#   cp deploy/.env.example deploy/.env  # 填完所有必填 secret
#   docker compose -f deploy/compose.yaml up -d
# 逻辑库：control_plane / casebase（见 postgres/init）

services:
  postgres:
    image: postgres:17  # pgvector 镜像受网络限制不可拉取；向量检索 Phase 1 未启用（检索用全文+元数据）
    container_name: agentmed-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # 默认库；init 脚本再创建 control_plane/casebase
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${AGENTMED_BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - agentmed_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:?POSTGRES_USER is required}", "-d", "control_plane"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ---- Wave 3：control-plane 服务化（确定性控制面）—— 仅 APPEND，不动上方服务 ----
  control-plane:
    build:
      context: ..
      dockerfile: control-plane/Dockerfile
    container_name: agentmed-control-plane
    environment:
      # compose 内部网络：直连 postgres 容器（宿主映射见 ports）
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/control_plane"
      # 被治理应用评估面（AgentMED 内核：/v2/versionsets + /v2/logs）
      QUALITY_API_BASE_URL: ${QUALITY_API_BASE_URL:-http://127.0.0.1:8088}
      QUALITY_API_TOKEN: ${QUALITY_API_TOKEN:-${AGENTMED_READ_TOKEN:?AGENTMED_READ_TOKEN is required}}
      # Gate/WorkOrder/Approval/Release mutation boundary (read views remain Console-readable).
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?CONTROL_PLANE_TOKEN is required}
      APPROVAL_AUTHORITY_TOKEN: ${APPROVAL_AUTHORITY_TOKEN:?APPROVAL_AUTHORITY_TOKEN is required}
      GATE_AUTHORITY_TOKEN: ${GATE_AUTHORITY_TOKEN:?GATE_AUTHORITY_TOKEN is required}
      CONTROL_PLANE_ROLE_TOKENS_JSON: ${CONTROL_PLANE_ROLE_TOKENS_JSON:?CONTROL_PLANE_ROLE_TOKENS_JSON is required}
      REQUIRE_MCP_ROLE_TOKENS: "true"
      # Public V4/V5 credentials use a separate authority namespace. Both
      # secrets are required, distinct from each other, and may not reuse an
      # internal controller/role token.
      PUBLIC_CREDENTIAL_HASH_PEPPER: ${PUBLIC_CREDENTIAL_HASH_PEPPER:?PUBLIC_CREDENTIAL_HASH_PEPPER is required}
      PUBLIC_CURSOR_SIGNING_KEY: ${PUBLIC_CURSOR_SIGNING_KEY:?PUBLIC_CURSOR_SIGNING_KEY is required}
      PUBLIC_AUTH_ISSUER: ${PUBLIC_AUTH_ISSUER:-https://auth.agentmed.dev}
      # Controlled B1 demo injection is disabled unless the live-demo operator
      # opts in explicitly.  The control plane remains the only caller of the
      # Quality write endpoint.
      ALLOW_DEMO_FAULT_INJECTION: ${ALLOW_DEMO_FAULT_INJECTION:-false}
      NOTIFICATION_ADAPTER: ${NOTIFICATION_ADAPTER:-disabled}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_BASE_URL: ${FEISHU_BASE_URL:-https://open.feishu.cn}
    ports:
      - "${AGENTMED_BIND_HOST:-127.0.0.1}:${CONTROL_PLANE_HOST_PORT:-18090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Fixed legacy-v3 Phase-1 transactional outbox dispatcher. This process
  # intentionally does not claim or deliver V4/V5 outbox rows; the V5 durable
  # capability-plane dispatcher remains a later stage.
  outbox-dispatcher:
    build:
      context: ..
      dockerfile: control-plane/Dockerfile
    container_name: agentmed-outbox-dispatcher
    entrypoint: ["python", "-m", "app.workers.outbox"]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/control_plane"
      OUTBOX_RELAY_INTERVAL_SECONDS: "1"
      OUTBOX_CLAIM_TTL_SECONDS: "30"
      OUTBOX_MAX_ATTEMPTS: "5"
      NOTIFICATION_ADAPTER: ${NOTIFICATION_ADAPTER:-disabled}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_BASE_URL: ${FEISHU_BASE_URL:-https://open.feishu.cn}
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

  # ---- T7：console 运营后台（评委看板）—— 仅 APPEND，不动上方服务 ----
  console:
    build:
      context: ../console
    container_name: agentmed-console
    ports:
      - "${AGENTMED_BIND_HOST:-127.0.0.1}:${CONSOLE_HOST_PORT:-8088}:80"
    volumes:
      # 数据通路（冻结）：nginx 反代 /api/ → control-plane:8090（compose 内网）
      - ./nginx-console.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agentmed_pgdata:
    name: agentmed_pgdata
